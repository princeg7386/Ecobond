  EB.care.register("settings", { async render(el) {
    const s = await EB.api.get("/api/settings"), P = EB.prefs;
    const seg = (key, opts) => `<div class="seg" role="group" data-pref="${key}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${P.get(key) === v}">${l}</button>`).join("")}</div>`;
    const t = s.face_thresholds_in_use;
    el.innerHTML = `<div class="view-head"><div><h1>Settings</h1><p>Display settings only affect this device. EchoBond settings apply to everyone using it, and changes are logged.</p></div></div>
      <div class="grid2 even" style="margin-top:0"><div class="card"><div class="card-h"><h2>Display (this device)</h2></div><div class="card-b stack">
          <div class="spread"><span>Detail</span>${seg("detail", [["simple", "Simple"], ["detailed", "Detailed"]])}</div><p class="small faint" style="margin-top:-6px">Detailed shows match scores, retrieval evidence and model names.</p>
          <div class="spread"><span>Theme</span>${seg("theme", [["system", "System"], ["light", "Light"], ["dark", "Dark"], ["contrast", "High contrast"]])}</div>
          <div class="spread"><span>Text size</span>${seg("size", [["normal", "Normal"], ["large", "Large"], ["xlarge", "Extra large"]])}</div>
          <div class="spread"><span>Motion</span>${seg("motion", [["system", "System"], ["reduce", "Reduced"]])}</div>
          <div class="spread"><span>Getting-started checklist</span>${seg("checklist", [["show", "Show"], ["hide", "Hide"]])}</div></div></div>
        <div class="card"><div class="card-h"><h2>EchoBond</h2></div><div class="card-b stack">
          <label class="f">Voice language<select id="sLang"><option value="en-IN">English (India)</option><option value="en-GB">English (UK)</option><option value="en-US">English (US)</option></select></label>
          <label class="f">Speaking speed <small>slower is easier to follow</small><input id="sRate" type="range" min="0.6" max="1.1" step="0.02" value="${esc(s.voice_rate)}"></label>
          <div class="row"><button class="btn sm" type="button" id="sHear">Hear a sample</button></div>
          <label class="f">Name confidence threshold <small>EchoBond names someone only at or above this score. You can raise it; it can never go below ${t.minimum.toFixed(2)}.</small>
            <input id="sThr" type="range" min="${t.minimum}" max="0.99" step="0.01" value="${t.recognize}"><span class="mono small" id="sThrV">${t.recognize.toFixed(2)}</span></label>
          <div class="form-row"><label class="f">Repeated question after<select id="sRep">${[2, 3, 4, 5, 6].map((n) => `<option ${+s.repeat_threshold === n ? "selected" : ""}>${n}</option>`).join("")}</select></label>
            <label class="f">…within (hours)<select id="sWin">${[6, 12, 24, 48].map((n) => `<option ${+s.repeat_window_hours === n ? "selected" : ""}>${n}</option>`).join("")}</select></label></div>
          <label class="f">Default privacy for new memories<select id="sPriv">${Object.entries(EB.dom.PRIVACY).map(([k, [, l]]) => `<option value="${k}" ${s.default_privacy === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
          <label class="f">Google Gemini API Key <small>Optional: gives family voice companions dynamic AI conversational intelligence</small>
            <input id="sGemini" type="password" placeholder="AIzaSy... (leave blank to use built-in Adaptive Engine)" value="${esc(s.gemini_api_key || "")}">
          </label>
          <div class="form-foot"><button class="btn primary" type="button" id="sSave">Save settings</button><span class="msg" id="sMsg"></span></div></div></div></div>`;
    $("#sLang", el).value = s.voice_lang;
    $("#sThr", el).addEventListener("input", (e) => ($("#sThrV", el).textContent = Number(e.target.value).toFixed(2)));
    el.querySelectorAll("[data-pref] button").forEach((b) => b.addEventListener("click", () => { P.set(b.parentElement.dataset.pref, b.dataset.v); EB.care.refresh(); }));
    $("#sHear", el).addEventListener("click", () => { EB.speech.setVoice($("#sLang", el).value, $("#sRate", el).value); EB.speech.say("Good morning, Kamala. Priya is visiting at five today."); });
    $("#sSave", el).addEventListener("click", async () => {
      const thr = Number($("#sThr", el).value);
      try { const r = await EB.api.patch("/api/settings", { voice_lang: $("#sLang", el).value, voice_rate: $("#sRate", el).value, repeat_threshold: $("#sRep", el).value, repeat_window_hours: $("#sWin", el).value,
          default_privacy: $("#sPriv", el).value, gemini_api_key: $("#sGemini", el).value.trim(), face_recognize_threshold: thr <= t.minimum + 0.001 ? "default" : thr });
        EB.speech.setVoice(r.voice_lang, r.voice_rate); EB.dom.toast("Settings saved"); }
      catch (e) { $("#sMsg", el).className = "msg bad"; $("#sMsg", el).textContent = e.message; }
    });
  } });

  EB.care.register("help", { async render(el) {
    el.innerHTML = `<div class="view-head"><div><h1>Help & documents</h1><p>Short answers for everyday use, who to call, and the project's safety and privacy documents.</p></div></div>
      <div class="grid2 even" style="margin-top:0"><div>
        <details class="faq" open><summary>What should I do when I get an alert?</summary><p>Go to Kamala first. Each alert includes a suggestion. When you've helped, press “I've handled this”.</p></details>
        <details class="faq"><summary>EchoBond said “I'm not sure”. Is it broken?</summary><p>No. It's designed to say that rather than risk the wrong name. Add two or three recent, front-facing photos of that person on the People page.</p></details>
        <details class="faq"><summary>What do the privacy levels mean?</summary><p>Normal: EchoBond can share it. Private: only if Kamala asks about it directly. Sensitive: never shared with Kamala. Locked: never shared, and you need the PIN to read it.</p></details>
        <details class="faq"><summary>How do I stop EchoBond mentioning someone who has died?</summary><p>On People, open “More” next to their name and choose “Mark as protected”. Their memories are never shared, and you're alerted if Kamala asks about them.</p></details>

        <details class="faq"><summary>Keyboard shortcuts</summary><p><span class="kbd">Ctrl K</span> or <span class="kbd">/</span> opens search and quick actions. <span class="kbd">Esc</span> closes dialogs.</p></details></div>

            <span class="row"><a class="btn sm" href="tel:${n}">${EB.icon("phone")} Call</a><button class="btn sm" type="button" data-copy="${n}">Copy</button></span></div>`).join("")}
          <p class="small faint">If the Call button does nothing on this device, dial the number shown. ARDSI (Alzheimer's and Related Disorders Society of India) runs caregiver support groups in many cities.</p></div></div></div>
      <h2 style="margin:24px 0 12px">Documents</h2>${EB.docs.listHTML()}`;
    el.addEventListener("click", async (e) => { const b = e.target.closest("[data-copy]"); if (!b) return;
      try { await navigator.clipboard.writeText(b.dataset.copy); EB.dom.toast(`Copied ${b.dataset.copy}`); } catch (err) { EB.dom.toast(`The number is ${b.dataset.copy}`); } });
  } });
})(window.EB);

;
/* Boot: apply display preferences, connect to the server (or start example mode), render the route. */
(function (EB) {
  "use strict";
  EB.prefs.apply();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => EB.prefs.apply());
  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") || (e.key === "/" && !typing)) {
      if (!EB.router.current || EB.router.current.area !== "care") return;
      e.preventDefault(); EB.palette.open();
    }
  });
  window.addEventListener("unhandledrejection", (e) => { console.error(e.reason); EB.dom.toast(e.reason && e.reason.friendly ? e.reason.message : EB.dom.FRIENDLY); });
  (async () => {
    try { await EB.api.init(); }
    catch (e) { console.error(e); document.getElementById("landing").innerHTML = `<div class="error-box" style="margin:40px auto;max-width:520px">${EB.dom.FRIENDLY}</div>`; return; }
    document.documentElement.dataset.mode = EB.api.live ? "live" : "example";
    await EB.router.render();
  })();
})(window.EB);

</script>
