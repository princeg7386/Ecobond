<style>
/* EchoBond design tokens and base styles.
   Layout concept: a calm night-sky "memory constellation" behind frosted-glass panels. Teal is the voice of
   EchoBond, amber is warmth (people, memories), lavender is protection (privacy, safety).
   Dark-first: dark values on bare :root, light under prefers-color-scheme: light, plus an explicit
   "contrast" theme (black on white, no glass, no glow) for the one-click Easy view. */
:root {
  --bg: #0b0f19;
  --bg-2: #0f1626;
  --surface: rgba(20, 28, 46, 0.62);          /* frosted glass */
  --surface-solid: #141c2e;                    /* dialogs, menus, inputs that need opacity */
  --surface-2: rgba(255, 255, 255, 0.045);
  --border: rgba(186, 214, 255, 0.11);
  --border-strong: rgba(186, 214, 255, 0.2);
  --text: #e9eef7;
  --text-2: #b2bcd0;
  --text-3: #8591a9;
  --accent: #4fd1c5;                            /* bio-teal */
  --accent-hover: #74e0d6;
  --accent-weak: rgba(79, 209, 197, 0.13);
  --on-accent: #052520;
  --amber: #f3b86c;                             /* warm glow: people and memories */
  --amber-weak: rgba(243, 184, 108, 0.14);
  --lavender: #b9a8f6;                          /* protection */
  --lavender-weak: rgba(185, 168, 246, 0.14);
  --ok: #6fd3a3; --ok-bg: rgba(111, 211, 163, 0.13);
  --warn: #f1c46b; --warn-bg: rgba(241, 196, 107, 0.13);
  --bad: #f4907f; --bad-bg: rgba(244, 144, 127, 0.14);
  --protect: #b9a8f6; --protect-bg: rgba(185, 168, 246, 0.14);
  --test: #f3c56f; --test-bg: rgba(243, 197, 111, 0.12);
  --glow-1: rgba(79, 209, 197, 0.16);
  --glow-2: rgba(185, 168, 246, 0.13);
  --glow-3: rgba(243, 184, 108, 0.09);
  --shadow: 0 18px 50px rgba(2, 6, 16, 0.45);
  --hi: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  --blur: blur(18px) saturate(140%);
  /* WebGL palette (hex only, read by the 3D scenes) */
  --c-teal: #4fd1c5; --c-amber: #f3b86c; --c-lav: #b9a8f6; --c-line: #5b6c8f; --c-rose: #f4907f; --c-ok: #6fd3a3;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  --r-sm: 9px;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease: cubic-bezier(.22, .8, .24, 1);
  --fs: 15px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]):not([data-theme="contrast"]) {
  --bg: #eef2f8; --bg-2: #e6ecf5; --surface: rgba(255, 255, 255, 0.7); --surface-solid: #ffffff; --surface-2: rgba(20, 40, 80, 0.045);
  --border: rgba(30, 50, 90, 0.12); --border-strong: rgba(30, 50, 90, 0.22);
  --text: #141c2c; --text-2: #445069; --text-3: #5f6b82;
  --accent: #0d8a80; --accent-hover: #0a766d; --accent-weak: rgba(13, 138, 128, 0.11); --on-accent: #ffffff;
  --amber: #a8620c; --amber-weak: rgba(168, 98, 12, 0.1); --lavender: #6550c4; --lavender-weak: rgba(101, 80, 196, 0.1);
  --ok: #1f7a50; --ok-bg: rgba(31, 122, 80, 0.1); --warn: #8a5a00; --warn-bg: rgba(138, 90, 0, 0.1);
  --bad: #b23b2a; --bad-bg: rgba(178, 59, 42, 0.1); --protect: #6550c4; --protect-bg: rgba(101, 80, 196, 0.1);
  --test: #7a4d00; --test-bg: rgba(200, 140, 20, 0.14);
  --glow-1: rgba(13, 138, 128, 0.12); --glow-2: rgba(101, 80, 196, 0.1); --glow-3: rgba(168, 98, 12, 0.07);
  --shadow: 0 16px 44px rgba(30, 50, 90, 0.14); --hi: inset 0 1px 0 rgba(255, 255, 255, 0.7);
  --c-teal: #0d8a80; --c-amber: #b86e12; --c-lav: #6550c4; --c-line: #9aa8c4; --c-rose: #b23b2a; --c-ok: #1f7a50;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #eef2f8; --bg-2: #e6ecf5; --surface: rgba(255, 255, 255, 0.7); --surface-solid: #ffffff; --surface-2: rgba(20, 40, 80, 0.045);
  --border: rgba(30, 50, 90, 0.12); --border-strong: rgba(30, 50, 90, 0.22);
  --text: #141c2c; --text-2: #445069; --text-3: #5f6b82;
  --accent: #0d8a80; --accent-hover: #0a766d; --accent-weak: rgba(13, 138, 128, 0.11); --on-accent: #ffffff;
  --amber: #a8620c; --amber-weak: rgba(168, 98, 12, 0.1); --lavender: #6550c4; --lavender-weak: rgba(101, 80, 196, 0.1);
  --ok: #1f7a50; --ok-bg: rgba(31, 122, 80, 0.1); --warn: #8a5a00; --warn-bg: rgba(138, 90, 0, 0.1);
  --bad: #b23b2a; --bad-bg: rgba(178, 59, 42, 0.1); --protect: #6550c4; --protect-bg: rgba(101, 80, 196, 0.1);
  --test: #7a4d00; --test-bg: rgba(200, 140, 20, 0.14);
  --glow-1: rgba(13, 138, 128, 0.12); --glow-2: rgba(101, 80, 196, 0.1); --glow-3: rgba(168, 98, 12, 0.07);
  --shadow: 0 16px 44px rgba(30, 50, 90, 0.14); --hi: inset 0 1px 0 rgba(255, 255, 255, 0.7);
  --c-teal: #0d8a80; --c-amber: #b86e12; --c-lav: #6550c4; --c-line: #9aa8c4; --c-rose: #b23b2a; --c-ok: #1f7a50;
  color-scheme: light; }
/* High contrast (part of Easy view): black on white, solid surfaces, strong borders, no glass or glow */
:root[data-theme="contrast"] {
  --bg: #ffffff; --bg-2: #ffffff; --surface: #ffffff; --surface-solid: #ffffff; --surface-2: #f0f0f0;
  --border: #000000; --border-strong: #000000; --text: #000000; --text-2: #111111; --text-3: #2b2b2b;
  --accent: #00456e; --accent-hover: #003050; --accent-weak: #d6ecfa; --on-accent: #ffffff;
  --amber: #6b3d00; --amber-weak: #ffe9c7; --lavender: #3d2a99; --lavender-weak: #e4dcff;
  --ok: #005c2e; --ok-bg: #d9f2e3; --warn: #6b4100; --warn-bg: #ffe9b8; --bad: #8c0f00; --bad-bg: #ffd9d3;
  --protect: #3d2a99; --protect-bg: #e4dcff; --test: #6b4100; --test-bg: #ffe9b8;
  --glow-1: transparent; --glow-2: transparent; --glow-3: transparent; --shadow: none; --hi: none; --blur: none;
  --c-teal: #00456e; --c-amber: #6b3d00; --c-lav: #3d2a99; --c-line: #555555; --c-rose: #8c0f00; --c-ok: #005c2e;
  color-scheme: light; }
:root.large { --fs: 17px; }
:root.xlarge { --fs: 20px; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
:root.reduce-motion, :root.reduce-motion * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs)/1.55 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
/* Ambient glows behind every screen (fixed, decorative, never intercepts input) */
body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: radial-gradient(60vw 50vh at 12% 0%, var(--glow-1), transparent 70%), radial-gradient(50vw 50vh at 100% 20%, var(--glow-2), transparent 70%),
    radial-gradient(60vw 40vh at 50% 110%, var(--glow-3), transparent 70%), linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); }
h1, h2, h3, h4 { margin: 0; font-weight: 700; text-wrap: balance; line-height: 1.22; }
h1 { font-size: 1.45em; } h2 { font-size: 1.12em; } h3 { font-size: 1em; } h4 { font-size: 0.93em; }
.display, .view-head h1 { font-family: var(--display); font-weight: 400; letter-spacing: 0.005em; }
.view-head h1 { font-size: 2em; line-height: 1.1; }
p { margin: 0; }
a { color: var(--accent); }
img { max-width: 100%; }
::selection { background: var(--accent-weak); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 0.87em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -40px; z-index: 100; padding: 8px 12px; background: var(--accent); color: var(--on-accent); border-radius: 6px; }
.skip:focus { top: 8px; }
body.simple .detail { display: none !important; }
body:not(.simple) .simple-only { display: none !important; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }

/* Shared components: buttons, fields, glass cards, chips, tables, lists, dialogs, toasts.
   Motion: hover and press use a short spring (var(--spring)); everything is switched off by reduced motion. */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-strong);
  background: var(--surface-2); color: var(--text); font: 700 0.92em var(--sans); cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: transform .35s var(--spring), background-color .2s, border-color .2s, box-shadow .3s; }
.btn:hover { background: var(--accent-weak); border-color: var(--accent); transform: translateY(-1px); }
.btn:active { transform: scale(.96); transition-duration: .1s; }
.btn.primary { background: linear-gradient(180deg, var(--accent-hover), var(--accent)); border-color: transparent; color: var(--on-accent); box-shadow: 0 6px 22px -6px var(--accent); }
.btn.primary:hover { box-shadow: 0 10px 30px -6px var(--accent); }
.btn.sm { min-height: 28px; padding: 0 10px; font-size: 0.84em; }
.btn.lg { min-height: 44px; padding: 0 20px; font-size: 1em; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-bg); border-color: var(--bad); }
.btn.danger.solid, .btn.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { border-color: var(--border-strong); background: var(--surface-2); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
input[type="text"], input[type="password"], input[type="search"], input[type="time"], input[type="number"], select, textarea {
  min-height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); background: var(--surface-2); color: var(--text); font: 0.95em var(--sans); min-width: 0;
  transition: border-color .2s, box-shadow .2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
select option { background: var(--surface-solid); color: var(--text); }
textarea { min-height: 76px; padding: 9px 12px; resize: vertical; width: 100%; }
input[type="range"] { accent-color: var(--accent); }
label.f { display: grid; gap: 5px; font-size: 0.87em; color: var(--text-2); font-weight: 700; }
label.f input, label.f select { width: 100%; }
label.f small { font-weight: 400; color: var(--text-3); }
label.cb { display: flex; gap: 8px; align-items: flex-start; font-size: 0.93em; color: var(--text); cursor: pointer; }
label.cb input { margin: 3px 0 0; accent-color: var(--accent); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); flex-wrap: wrap; }
.seg button { min-height: 30px; padding: 0 13px; border: 0; border-radius: 999px; background: transparent; color: var(--text-2); font: 700 0.88em var(--sans); cursor: pointer; transition: background-color .2s, color .2s; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.card { background: var(--surface); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--hi); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-h h2, .card-h h3 { display: flex; align-items: center; gap: 8px; }
.card-h > span { font-size: 0.86em; color: var(--text-3); }
.card-b { padding: 14px 16px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 700 0.76em/1.7 var(--sans); padding: 0 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--text-2); letter-spacing: .01em;
  transition: transform .3s var(--spring); }
.chip:hover { transform: translateY(-1px); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.protect { background: var(--protect-bg); color: var(--protect); }
.chip.info { background: var(--accent-weak); color: var(--accent); }
.chip.amber { background: var(--amber-weak); color: var(--amber); }
.chip.test { background: var(--test-bg); color: var(--test); letter-spacing: .06em; box-shadow: inset 0 0 0 1px var(--test); }
.av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); display: inline-grid; place-items: center; font-weight: 700; font-size: 0.85em; color: var(--text-2); box-shadow: 0 0 0 2px var(--border); }
.av.lg { width: 60px; height: 60px; font-size: 1.1em; box-shadow: 0 0 0 2px var(--amber), 0 0 22px -4px var(--amber); }
.who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.say { padding: 14px 16px; border-radius: var(--r); background: linear-gradient(135deg, var(--accent-weak), var(--lavender-weak)); border: 1px solid var(--border); color: var(--text); font-size: 1.07em; line-height: 1.6; }
.say.neutral { background: var(--surface-2); }
.empty { padding: 20px 16px; color: var(--text-3); font-size: 0.93em; }
.error-box { padding: 12px 14px; border: 1px solid var(--bad); border-radius: var(--r-sm); background: var(--bad-bg); color: var(--bad); }
.loading { color: var(--text-3); font-size: 0.93em; padding: 12px 14px; }
.loading::after { content: "…"; }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.93em; }
th { text-align: left; font-weight: 700; color: var(--text-3); font-size: 0.78em; letter-spacing: .06em; text-transform: uppercase; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
tbody tr { transition: background-color .2s; }
tbody tr:hover { background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.actions { white-space: nowrap; text-align: right; }
td.actions > * + * { margin-left: 4px; }
td .sub { display: block; color: var(--text-3); font-size: 0.85em; }
tr.flash td { background: var(--accent-weak); }

.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 16px; border-bottom: 1px solid var(--border); }
.rows li:last-child { border-bottom: 0; }
.rows .t { font: 0.84em var(--mono); color: var(--text-3); padding-top: 2px; white-space: nowrap; }
.rows .main b { font-weight: 700; }
.rows .main .sub { color: var(--text-2); font-size: 0.87em; }
.rows .hint { color: var(--text); font-size: 0.87em; margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--accent); }
.rows li.done .main { color: var(--text-3); }
.rows li.now { background: var(--accent-weak); }
@media (max-width: 560px) { .rows li { grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; } .rows .t { grid-column: 1 / -1; } }

details.menu { position: relative; display: inline-block; }
details.menu > summary { list-style: none; }
details.menu > summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); min-width: 210px; background: var(--surface-solid); border: 1px solid var(--border-strong); border-radius: var(--r-sm); box-shadow: var(--shadow); padding: 5px; z-index: 30; display: grid; text-align: left; animation: pop .28s var(--spring); }
.menu-list button { text-align: left; padding: 8px 11px; border: 0; border-radius: 6px; background: none; color: var(--text); font: 0.93em var(--sans); cursor: pointer; white-space: nowrap; }
.menu-list button:hover { background: var(--accent-weak); }
.menu-list button.danger { color: var(--bad); }
details.faq { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); transition: border-color .2s; }
details.faq[open] { border-color: var(--border-strong); }
details.faq + details.faq { margin-top: 8px; }
details.faq summary { padding: 13px 16px; cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::after { content: "+"; color: var(--accent); font: 400 1.3em/1 var(--sans); transition: transform .35s var(--spring); }
details.faq[open] summary::after { transform: rotate(45deg); }
details.faq > div, details.faq > p { padding: 0 16px 14px; color: var(--text-2); }

/* "Why did EchoBond say that?" */
details.why { font-size: 0.87em; }
details.why summary { cursor: pointer; color: var(--accent); width: fit-content; font-weight: 700; }
.why-list { list-style: none; margin: 8px 0 0; padding: 10px 12px; border-left: 2px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; display: grid; gap: 5px; }
.why-list li::before { content: "✓ "; color: var(--ok); font-weight: 700; }
.why-list li.rule::before { content: "• "; color: var(--text-3); }

@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.dialog-back { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(4, 8, 18, .58); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fadein .2s; }
:root[data-theme="contrast"] .dialog-back { -webkit-backdrop-filter: none; backdrop-filter: none; }
.dialog { width: min(580px, 100%); max-height: 88vh; overflow: auto; background: var(--surface-solid); border: 1px solid var(--border-strong); border-radius: var(--r); box-shadow: var(--shadow); animation: pop .38s var(--spring); }
.dialog.wide { width: min(900px, 100%); }
.dialog-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface-solid); z-index: 1; }
.dialog-h h2 { font-family: var(--display); font-weight: 400; font-size: 1.45em; }
.dialog-b { padding: 18px; display: grid; gap: 12px; }
.dialog-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
.toast { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 70; padding: 11px 16px; border-radius: 999px; background: var(--surface-solid); color: var(--text); border: 1px solid var(--accent); box-shadow: var(--shadow), 0 0 24px -8px var(--accent); font-size: 0.93em; max-width: calc(100% - 32px); animation: pop .35s var(--spring); }
.form { display: grid; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.form-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.msg { font-size: 0.87em; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
.consent { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); }
.test-banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border: 1px dashed var(--test); background: var(--test-bg); color: var(--test); border-radius: var(--r-sm); font-size: 0.9em; }
.face-btn { display: grid; justify-items: center; align-content: start; gap: 5px; padding: 6px 2px; border: 1px solid transparent; border-radius: 12px; background: none; cursor: pointer; color: var(--text-2); font: 0.78em/1.25 var(--sans); width: 64px;
  transition: transform .35s var(--spring), background-color .2s; }
.face-btn img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px var(--border); transition: box-shadow .3s; }
.face-btn:hover { background: var(--surface-2); transform: translateY(-2px); }
.face-btn[aria-pressed="true"] { color: var(--accent); }
.face-btn[aria-pressed="true"] img { box-shadow: 0 0 0 2px var(--accent), 0 0 18px -2px var(--accent); }
.faces { display: flex; gap: 4px; flex-wrap: wrap; }
.ideas { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-2); font: 0.87em var(--sans); cursor: pointer;
  transition: transform .35s var(--spring), border-color .2s, color .2s, background-color .2s; }
.pill:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.pill:active { transform: scale(.95); }
.pill[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-weak); }
.privacy { display: inline-flex; align-items: center; gap: 4px; }

/* Command palette */
.palette { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; max-height: 50vh; overflow-y: auto; }
.palette li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
.palette li[aria-selected="true"], .palette li:hover { background: var(--accent-weak); color: var(--accent); }
.alert-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); font-size: .93em; }

/* Demo mode steps */
.demo-steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.demo-steps > li { display: grid; gap: 6px; padding: 10px 12px 10px 44px; position: relative; border-left: 1px solid var(--border-strong); animation: pop .4s var(--spring); }
.demo-steps > li:not(.faint)::before { counter-increment: s; content: counter(s); position: absolute; left: 10px; top: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: 700 12px/22px var(--mono); text-align: center; box-shadow: 0 0 14px -2px var(--accent); }
.demo-steps > li.faint { padding-left: 12px; }
.demo-steps p { margin: 0; }

/* Mouse-tilt cards (see js/ui/fx.js). The glare follows the pointer. */
[data-tilt] { transform-style: preserve-3d; transition: transform .5s var(--spring); will-change: transform; position: relative; }
[data-tilt]::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .09), transparent 60%); }
[data-tilt]:hover::after { opacity: 1; }
:root[data-theme="contrast"] [data-tilt]::after { display: none; }

/* Easy view switch, in every header */
.easy-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
/* Alert rows: actions sit under the text, so long titles never get squeezed into a narrow column */
.rows li:has(> .row:last-child) { grid-template-columns: auto minmax(0, 1fr); }
.rows li > .row:last-child { grid-column: 2; justify-content: flex-start !important; }
@media (max-width: 560px) { .rows li > .row:last-child { grid-column: 1 / -1; } }

/* Landing page over the full-screen Memory Core. Content floats on frosted glass; the constellation
   stays bright in the hero and the Memory Core section and dims elsewhere so text stays readable. */
.nebula { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; transition: opacity .8s var(--ease); }
.nebula-scrim { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(120% 90% at 50% 40%, transparent 40%, var(--bg) 100%); opacity: .7; }
.core-labels { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: opacity .5s; }
.core-name { position: absolute; left: 0; top: 0; font: 700 0.76em var(--sans); padding: 2px 9px; border-radius: 999px; background: var(--surface); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--border); color: var(--text); white-space: nowrap; will-change: transform; }
.core-name.core-me { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 18px -4px var(--accent); }
.core-name.core-q { color: var(--accent); border-style: dashed; }

.lp-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 62%, transparent); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: 1px solid var(--border); }
:root[data-theme="contrast"] .lp-top { background: var(--bg); }
.lp-top .in { height: 60px; display: flex; align-items: center; gap: 22px; }
.wordmark { display: inline-flex; align-items: center; gap: 10px; font: 400 1.55em/1 var(--display); color: var(--text); text-decoration: none; letter-spacing: .01em; }
.wordmark .mark { width: 26px; height: 18px; position: relative; flex: none; }
.wordmark .mark::before, .wordmark .mark::after { content: ""; position: absolute; top: 0; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); }
.wordmark .mark::before { left: 0; } .wordmark .mark::after { right: 0; border-color: var(--amber); }
.lp-top nav { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }
.lp-top nav a { color: var(--text-2); text-decoration: none; font-size: 0.92em; transition: color .2s; }
.lp-top nav a:hover { color: var(--accent); }
@media (max-width: 960px) { .lp-top nav { display: none; } .lp-top .row { margin-left: auto; } }
@media (max-width: 520px) { .hide-xs, .lp-top .easy-btn span { display: none; } .wordmark { font-size: 1.3em; } }
.lp .in, .lp-top .in, .lp-foot .in { max-width: 1180px; margin: 0 auto; padding-inline: 20px; }
.lp section { padding-block: 72px; }
.eyebrow { display: inline-block; font: 500 0.76em var(--mono); color: var(--accent); letter-spacing: .14em; text-transform: uppercase; }
.lp h2.sec { font-size: clamp(1.9em, 3.6vw, 2.7em); line-height: 1.08; margin-top: 8px; max-width: 24ch; }
.lp p.sec { color: var(--text-2); margin-top: 12px; max-width: 64ch; font-size: 1.04em; }

.hero { padding-block: 64px 80px !important; }
.hero .in { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 40px; align-items: center; min-height: min(78vh, 760px); }
.hero-space { min-height: 300px; }
@media (max-width: 960px) { .hero-space { display: none; } .hero .in { min-height: 0; } }
@media (max-width: 960px) { .hero .in { grid-template-columns: minmax(0, 1fr); gap: 32px; } }
.hero h1 { font-size: clamp(2.3em, 5.4vw, 4.1em); line-height: 1.02; margin-top: 14px; max-width: 16ch; font-weight: 400; }
.hero h1 em { font-style: italic; color: var(--accent); text-shadow: 0 0 40px var(--accent-weak); }
.hero .lead { font-size: 1.12em; color: var(--text-2); max-width: 54ch; margin-top: 18px; }
.hero .cta { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.hero .note { margin-top: 16px; font-size: 0.84em; color: var(--text-3); }
.voice-strip { margin-top: 24px; padding: 12px 14px; display: grid; gap: 8px; max-width: 560px; }
.voice-strip canvas { width: 100%; height: 56px; display: block; }
.try-sec { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 40px; align-items: center; }
@media (max-width: 960px) { .try-sec { grid-template-columns: minmax(0, 1fr); } }
.try-notes { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; color: var(--text-2); }
.try-notes li { display: flex; gap: 10px; align-items: flex-start; } .try-notes .ico { color: var(--accent); margin-top: 3px; }
.try .card-b { padding: 14px; }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 28px; padding: 0; list-style: none; }
@media (max-width: 860px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
.tile { padding: 22px; display: grid; gap: 8px; align-content: start; }
.tile > .ico { width: 28px; height: 28px; color: var(--accent); }
.tile p { color: var(--text-2); font-size: 0.95em; }
.steps3 .n { font: 400 2.2em/1 var(--display); color: var(--amber); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } }
.facts { display: grid; gap: 10px; }
.fact { display: grid; grid-template-columns: 7ch minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 16px 18px; }
.fact b { font: 400 1.9em/1 var(--display); color: var(--amber); }
.fact small { display: block; color: var(--text-3); font-size: 0.8em; margin-top: 2px; }

/* Pipeline: seven connected nodes with a travelling light */
.pipe { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 30px; position: relative; }
.pipe::before { content: ""; position: absolute; left: 4%; right: 4%; top: 38px; height: 2px; background: linear-gradient(90deg, var(--accent), var(--lavender), var(--amber)); opacity: .35; border-radius: 2px; }
.pipe-node { position: relative; display: grid; justify-items: center; align-content: start; gap: 6px; padding: 14px 6px 12px; text-align: center; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--text); font: inherit; cursor: pointer; transition: transform .4s var(--spring), border-color .25s, box-shadow .3s; }
.pipe-node:hover { transform: translateY(-3px); border-color: var(--border-strong); }
.pipe-node[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 12px 32px -14px var(--accent); }
.pn-ico { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); border: 1px solid var(--border-strong); color: var(--accent); transition: box-shadow .3s, background-color .3s; }
.pn-ico .ico { width: 22px; height: 22px; }
.pn-n { font: 500 0.72em var(--mono); color: var(--text-3); letter-spacing: .1em; }
.pn-t { font-weight: 700; font-size: 0.86em; line-height: 1.25; }
.pn-out { font: 0.74em/1.3 var(--mono); color: var(--accent); min-height: 2.6em; overflow-wrap: anywhere; }
.pipe-node.live .pn-ico { background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 6px var(--accent-weak), 0 0 30px var(--accent); }
.pipe-node.done .pn-ico { border-color: var(--accent); box-shadow: 0 0 18px -4px var(--accent); }
.pipe-foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; margin-top: 16px; align-items: start; }
.pipe-detail { padding: 20px 22px; display: grid; gap: 10px; }
.pipe-run { display: grid; gap: 8px; justify-items: end; }
@media (max-width: 960px) {
  .pipe { grid-template-columns: repeat(4, minmax(0, 1fr)); } .pipe::before { display: none; }
  .pipe-foot { grid-template-columns: minmax(0, 1fr); } .pipe-run { justify-items: start; }
}
@media (max-width: 520px) { .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Memory Core chapters: text cards on the left, the constellation shows through on the right */
.chapters { display: grid; margin-top: 12px; }
.chapter { min-height: 82vh; display: grid; align-content: center; }
.ch-card { padding: 22px 24px; max-width: 430px; display: grid; gap: 8px; opacity: .55; transform: translateX(-6px); transition: opacity .5s, transform .6s var(--spring), border-color .3s; }
.chapter.on .ch-card { opacity: 1; transform: none; border-color: var(--accent); box-shadow: var(--hi), 0 20px 50px -24px var(--accent); }
.ch-card .n { font: 500 0.76em var(--mono); color: var(--text-3); letter-spacing: .1em; }
.chapter.on .ch-card .n { color: var(--accent); }
.ch-card h3 { font-size: 2em; font-weight: 400; }
.ch-card p { color: var(--text-2); }
@media (max-width: 860px) { .chapter { min-height: 70vh; align-content: end; padding-bottom: 8vh; } .ch-card { max-width: none; } }

/* Bento grid */
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: dense; gap: 14px; margin-top: 30px; }
.b-tile { padding: 20px; display: grid; gap: 8px; align-content: start; }
.b-tile > .ico { width: 26px; height: 26px; color: var(--accent); }
.b-tile p { color: var(--text-2); }
.b-wide { grid-column: span 2; }
.b-tall { grid-row: span 2; }
@media (max-width: 960px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .bento { grid-template-columns: minmax(0, 1fr); } .b-wide { grid-column: auto; } .b-tall { grid-row: auto; } }
.thr { display: flex; height: 30px; border-radius: 999px; overflow: hidden; margin-top: 6px; font: 700 0.72em var(--sans); }
.thr span { width: var(--w); display: grid; place-items: center; white-space: nowrap; overflow: hidden; }
.thr .u { background: var(--bad-bg); color: var(--bad); } .thr .n { background: var(--warn-bg); color: var(--warn); } .thr .y { background: var(--ok-bg); color: var(--ok); }

.shot { padding: 0; overflow: hidden; }
.shot .rows li { padding-block: 9px; }
.lp-foot { padding: 28px 0 110px; font-size: 0.86em; color: var(--text-3); border-top: 1px solid var(--border); }
.lp-foot .in { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* Presentation bar: six scenarios, fixed to the bottom of the landing page */
.present { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 6px;
  max-width: calc(100% - 24px); padding: 6px; border-radius: 999px; background: color-mix(in srgb, var(--surface-solid) 82%, transparent); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--border-strong); box-shadow: var(--shadow); }
.present-l { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 8px; font: 700 0.8em var(--sans); color: var(--accent); letter-spacing: .06em; text-transform: uppercase; flex: none; }
.present-s { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.present-s::-webkit-scrollbar { display: none; }
.present button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 13px 0 6px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--text-2);
  font: 0.82em var(--sans); cursor: pointer; white-space: nowrap; transition: background-color .2s, color .2s, transform .35s var(--spring); }
.present button b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 700 0.85em var(--mono); color: var(--text); }
.present button:hover { color: var(--text); background: var(--surface-2); transform: translateY(-1px); }
.present button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
.present button[aria-pressed="true"] b { background: var(--accent); color: var(--on-accent); }
@media (max-width: 560px) { .present-l span { display: none; } }

/* App shell (caregiver dashboard) and the large-print patient mode. */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: color-mix(in srgb, var(--bg) 66%, transparent); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: 1px solid var(--border); }
:root[data-theme="contrast"] .top, :root[data-theme="contrast"] .patient-top { background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; background: none; border: 0; padding: 0; color: var(--text); font: inherit; cursor: pointer; text-decoration: none; }
.brand b { font: 400 1.45em/1 var(--display); }
.brand span { color: var(--text-3); font-size: 0.93em; }
.search { position: relative; flex: 1; max-width: 360px; margin-left: 8px; min-width: 0; }
.search input { width: 100%; }
.kbd { font: 0.75em var(--mono); padding: 1px 5px; border: 1px solid var(--border-strong); border-radius: 3px; color: var(--text-3); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.source { font-size: 0.8em; padding: 4px 10px; border-radius: 999px; background: var(--test-bg); color: var(--test); border: 1px solid transparent; white-space: nowrap; font-weight: 700; }
.source.live { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 60px); }
.side { padding: 16px 10px; border-right: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 40%, transparent); }
.side nav { display: grid; gap: 2px; position: sticky; top: 76px; }
.side .grp { font: 500 0.7em var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); padding: 14px 12px 6px; }
.side a { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; color: var(--text-2); font: 700 0.92em var(--sans); text-decoration: none; transition: background-color .2s, color .2s, transform .35s var(--spring); }
.side a .ico { color: var(--text-3); transition: color .2s; }
.side a .count { margin-left: auto; }
.side a:hover { transform: translateX(2px); }
.side a:hover { background: var(--surface-2); color: var(--text); }
.side a[aria-current="page"] { background: var(--accent-weak); color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
.side a[aria-current="page"] .ico { color: var(--accent); }
.count { font: 500 0.76em var(--mono); padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
.count.hot { background: var(--bad); color: #fff; box-shadow: 0 0 12px -2px var(--bad); }
main.view { padding: 26px 30px 64px; min-width: 0; }
.view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.view-head p { color: var(--text-2); font-size: 0.93em; margin-top: 2px; max-width: 72ch; }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 9px 14px; border: 1px dashed var(--test); background: var(--test-bg); border-radius: var(--r-sm); font-size: 0.88em; color: var(--text-2); margin-bottom: 20px; flex-wrap: wrap; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--border); padding: 6px 8px; overflow-x: auto; }
  .side nav { display: flex; position: static; }
  .side .grp { display: none; }
  .side a { white-space: nowrap; gap: 6px; }
  .brand span, .source, .search .kbd { display: none; }
  main.view { padding: 16px; }
}
@media (max-width: 560px) { .top .hide-s { display: none; } .search { max-width: none; } }

.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar input[type="search"] { width: 240px; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.grid2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .grid2, .grid2.even { grid-template-columns: minmax(0, 1fr); } }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 16px 18px; text-align: left; font: inherit; color: inherit; cursor: pointer; transition: transform .4s var(--spring), border-color .2s; }
.kpi:hover { border-color: var(--border-strong); }
.kpi .lbl { font-size: 0.87em; color: var(--text-2); }
.kpi .val { font: 400 2.4em/1.1 var(--display); margin-top: 6px; color: var(--text); }
.kpi .sub { font-size: 0.85em; color: var(--text-3); margin-top: 2px; }
.kpi .sub.warn { color: var(--warn); } .kpi .sub.bad { color: var(--bad); }
.summary-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.summary-list li { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 0.93em; }
.summary-list li b { font: 500 1.05em var(--mono); margin-right: 4px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--text-3); font: 11px var(--sans); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85em; color: var(--text-2); padding: 0 14px 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.check-h { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar { width: 160px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.todo { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }

.todo li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border); }

/* timeline */

.tl-items { display: flex; gap: 10px; flex-wrap: wrap; }
.tl-item { width: 220px; max-width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--text); font: inherit; cursor: pointer; display: grid; gap: 4px; transition: transform .35s var(--spring), border-color .2s; }
.tl-item:hover { transform: translateY(-2px); }
.tl-item:hover { border-color: var(--accent); }
.tl-item .y { font: 0.8em var(--mono); color: var(--text-3); }
.tl-item .meta { font-size: 0.8em; color: var(--text-3); }

/* graph & map */
.graph-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }

.graph svg, .map svg { width: 100%; height: auto; display: block; }

.graph .node:focus-visible circle.ring, .graph .node.on circle.ring { stroke: var(--accent); stroke-width: 3; }
.graph text, .map text { fill: var(--text); font: 12px var(--sans); }
.graph text.rel, .map text.sub { fill: var(--text-3); font-size: 11px; }
.map .pin { cursor: pointer; }
.map .pin:focus-visible circle, .map .pin.on circle { stroke: var(--accent); stroke-width: 3; }
.panel-side { padding: 14px; display: grid; gap: 10px; align-content: start; }
.music-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); }
.music-row:first-child { border-top: 0; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); cursor: pointer; display: grid; place-items: center; transition: transform .35s var(--spring); }
.play:hover { transform: scale(1.06); }
.play[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* chat */
.chat-log { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; min-height: 260px; max-height: 52vh; overflow-y: auto; }
.msg-b { max-width: 82%; padding: 11px 15px; border-radius: 16px; line-height: 1.55; animation: pop .35s var(--spring); }
.msg-b.me { align-self: flex-end; background: linear-gradient(180deg, var(--accent-hover), var(--accent)); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg-b.bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg-b .meta { display: block; margin-top: 6px; font-size: 0.8em; color: var(--text-3); }
.composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }
.composer input { flex: 1; }
.lens { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .lens { grid-template-columns: minmax(0, 1fr); } }
.lens-host { container-type: inline-size; }
@container (max-width: 620px) {
  .lens { grid-template-columns: minmax(0, 1fr); }
  .lens .viewfinder { aspect-ratio: 4 / 3; max-height: 240px; }
}
#careMain:focus, #pMain:focus { outline: none; }
.viewfinder { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: var(--r); overflow: hidden; background: radial-gradient(circle at 50% 40%, var(--accent-weak), var(--surface-2) 70%); border: 1px solid var(--border); }
.viewfinder img, .viewfinder video { width: 100%; height: 100%; object-fit: cover; display: block; }
.viewfinder .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.steps-mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 0.85em; }
.steps-mini li { display: grid; grid-template-columns: 24px 1fr auto; gap: 6px; color: var(--text-3); padding: 3px 0; }
.steps-mini li.done { color: var(--text); }
.steps-mini li.done span:first-child { color: var(--ok); }

/* Face HUD: corner brackets, a sweeping scanline while checking, and a status tag. */
.hud { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.hud i { position: absolute; width: 26px; height: 26px; border: 2px solid var(--accent); opacity: .8; transition: border-color .3s, inset .5s var(--spring); }
.hud i:nth-child(1) { left: 10px; top: 10px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.hud i:nth-child(2) { right: 10px; top: 10px; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
.hud i:nth-child(3) { left: 10px; bottom: 10px; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
.hud i:nth-child(4) { right: 10px; bottom: 10px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
.hud .scanline { position: absolute; left: 6%; right: 6%; top: 0; height: 2px; background: var(--accent); box-shadow: 0 0 16px 3px var(--accent); opacity: 0; }
.hud-tag { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font: 500 0.72em var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--surface-solid) 80%, transparent); color: var(--accent); border: 1px solid var(--accent); white-space: nowrap; }
.viewfinder.scanning .scanline { opacity: 1; animation: scan 1.1s var(--ease) infinite alternate; }
.viewfinder.scanning::after { content: ""; position: absolute; inset: 0; z-index: 1; background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(79, 209, 197, .06) 3px 4px); pointer-events: none; }
.viewfinder.found .hud i { border-color: var(--ok); }
.viewfinder.found .hud-tag { color: var(--ok); border-color: var(--ok); }
.viewfinder.unsure .hud i { border-color: var(--warn); }
.viewfinder.unsure .hud-tag { color: var(--warn); border-color: var(--warn); }
@keyframes scan { from { top: 6%; } to { top: 92%; } }
:root.reduce-motion .viewfinder.scanning .scanline { top: 50%; }

/* Agitation & repetition tracker (caregiver home) */
.tracker { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
@media (max-width: 900px) { .tracker { grid-template-columns: minmax(0, 1fr); } }
.tracker .chart-box { padding: 12px 16px 4px; border-right: 1px solid var(--border); }
@media (max-width: 900px) { .tracker .chart-box { border-right: 0; border-bottom: 1px solid var(--border); } }
.tracker svg { width: 100%; height: auto; display: block; }
.tracker svg text { fill: var(--text-3); font: 11px var(--sans); }
.rep-list { list-style: none; margin: 0; padding: 0; }
.rep-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.rep-list li:last-child { border-bottom: 0; }
.rep-n { min-width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 0.9em var(--mono); background: var(--surface-2); color: var(--text-2); }
.rep-n.hot { background: var(--warn); color: #1a1200; box-shadow: 0 0 16px -3px var(--warn); }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 2s infinite; margin-right: 6px; vertical-align: 1px; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.helplines { display: grid; gap: 8px; }
.helpline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); }
.helpline b.num { font: 400 1.5em/1 var(--display); color: var(--accent); }

/* ---------------- patient mode: large, calm, one thing per screen ---------------- */
.patient { min-height: 100vh; font-size: 1.25em; }
.patient-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 24px; background: color-mix(in srgb, var(--bg) 66%, transparent); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-bottom: 1px solid var(--border); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
.patient-top .greet { font-size: 1.6em; line-height: 1.1; }
.patient-top .date { color: var(--text-2); font-size: 0.85em; }
.patient main { max-width: 1000px; margin: 0 auto; padding: 28px 20px 64px; }
.p-h { font-size: 2.2em; margin-bottom: 18px; }
.p-next { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 20px; margin-bottom: 22px; border-color: var(--accent); box-shadow: var(--hi), 0 0 40px -18px var(--accent); }
.p-next > .ico { width: 30px; height: 30px; color: var(--accent); }
.big-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 640px) { .big-choices { grid-template-columns: minmax(0, 1fr); } }
.big { --tone: var(--accent); min-height: 190px; padding: 24px; color: var(--text); font: 700 1.2em var(--sans); cursor: pointer; display: grid; align-content: end; justify-items: start; gap: 6px; text-align: left; text-decoration: none; overflow: hidden;
  border: 1px solid var(--border); transition: transform .5s var(--spring), border-color .25s, box-shadow .35s; }
.big::before { content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--tone) 30%, transparent), transparent 70%); pointer-events: none; }
.big.t-lav { --tone: var(--lavender); } .big.t-amber { --tone: var(--amber); } .big.t-ok { --tone: var(--ok); }
.big small { font-weight: 400; font-size: 0.72em; color: var(--text-2); }
.big:hover, .big:focus-visible { border-color: var(--tone); box-shadow: var(--hi), 0 18px 50px -22px var(--tone); }
.big-ico { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; margin-bottom: auto; background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone); }
.big-ico .ico { width: 30px; height: 30px; }
:root[data-theme="contrast"] .big::before { display: none; }
.patient .btn { min-height: 54px; padding: 0 24px; font-size: 1em; }
.patient .btn.sm { min-height: 46px; font-size: 0.85em; }
.patient .say { font-size: 1.15em; padding: 20px 22px; }
.patient input[type="text"] { min-height: 54px; font-size: 1em; padding: 0 16px; }
.patient .back { margin-bottom: 18px; }

/* Talk: the big microphone and its aura */
.talk { display: grid; gap: 22px; }
.mic-wrap { display: grid; justify-items: center; gap: 14px; padding: 18px 0 6px; }
.mic { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--on-accent);
  background: radial-gradient(circle at 35% 30%, var(--accent-hover), var(--accent) 70%); box-shadow: 0 16px 50px -12px var(--accent); transition: transform .5s var(--spring); }
.mic .ico { width: 48px; height: 48px; position: relative; z-index: 1; }
.mic:hover { transform: scale(1.04); } .mic:active { transform: scale(.95); }
.mic:disabled { opacity: .5; cursor: not-allowed; }
.aura { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
.mic[data-state="idle"] .aura { animation: breathe 3.2s var(--ease) infinite; }
.mic[data-state="listening"] .aura { animation: ripple 1.6s var(--ease) infinite; }
.mic[data-state="listening"] .a2 { animation-delay: .53s; } .mic[data-state="listening"] .a3 { animation-delay: 1.06s; }
.mic[data-state="speaking"] { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--lavender) 70%, white), var(--lavender) 70%); box-shadow: 0 16px 50px -12px var(--lavender); }

.mic[data-state="speaking"] .a2 { animation-delay: .37s; } .mic[data-state="speaking"] .a3 { animation-delay: .74s; }
@keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(1.9); opacity: 0; } }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .25; } 50% { transform: scale(1.12); opacity: .5; } }
.mic-hint { color: var(--text-2); font-size: 1em; text-align: center; }

.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.flip { display: grid; gap: 10px; }
.flip-in { position: relative; display: block; width: 100%; aspect-ratio: 4 / 5; max-width: 100%; padding: 0; border: 0; background: none; cursor: pointer; perspective: 1200px; font: inherit; color: inherit; text-align: left; }
.flip-face { position: absolute; inset: 0; display: grid; align-content: end; gap: 6px; padding: 20px; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; transition: transform .8s var(--spring); }

.flip.turned .back { transform: rotateY(0deg); }

.front .mem-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
.mem-faces { position: absolute; left: 20px; top: 20px; display: flex; }

.day .dot .ico { width: 14px; height: 14px; }
.day li.done .dot { background: var(--ok); border-color: var(--ok); }
.day li.now .dot { border-color: var(--accent); box-shadow: 0 0 0 5px var(--accent-weak), 0 0 18px var(--accent); }
.day li.now .tm { color: var(--accent); }
.p-rem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 16px 18px; }
.p-rem > .ico { width: 26px; height: 26px; color: var(--accent); }
.p-rem .ph small { display: block; font: 700 0.7em var(--mono); color: var(--accent); letter-spacing: .1em; text-transform: uppercase; }
.day li.done .p-rem { opacity: .62; }
.day li.now .p-rem { border-color: var(--accent); }
@media (max-width: 640px) { .day li { grid-template-columns: 4em 20px minmax(0, 1fr); gap: 8px; } .day::before { left: calc(4em + 9px); } .p-rem { grid-template-columns: minmax(0, 1fr); } .p-rem > .ico { display: none; } }
.flip-face.card { -webkit-backdrop-filter: none; backdrop-filter: none; background-color: var(--surface-solid); }
.flip-face.back { background: linear-gradient(160deg, var(--accent-weak), var(--lavender-weak)), var(--surface-solid); }
.wm-mark { width: 26px; height: 18px; position: relative; flex: none; }
.wm-mark::before, .wm-mark::after { content: ""; position: absolute; top: 0; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); }
.wm-mark::before { left: 0; } .wm-mark::after { right: 0; border-color: var(--amber); }
.lock { -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
