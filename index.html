window.EB_DOCS = {"docs/safety/SAFETY_CASE.md": "# EchoBond Safety Case and Hazard Log\n\n**Version** 2.0 · **Date** 3 October 2026 · **Owner** EchoBond project team (21CSE306P) · **Status** Prototype, not for clinical use\n\n## 1. Purpose and scope\n\nThis document explains how EchoBond could harm a person living with Alzheimer's disease, their family, or other people, and what the system does to prevent it. It covers the full pipeline (stages 01–07), the web app, and the data the system stores.\n\nEchoBond is a **support tool for wellbeing and connection**. It is **not a medical device**. It does not diagnose, monitor, or treat any condition, and it must never replace a human caregiver.\n\n## 2. Safety claim\n\n> EchoBond is acceptably safe for supervised home use in a research demonstration, because every identified hazard has at least one control implemented in code, each critical control is verified by an automated test, and a caregiver remains in the loop for every situation the system cannot handle.\n\n## 3. Who could be affected\n\n| Person | How they could be affected |\n|---|---|\n| Patient (person living with Alzheimer's) | Confusion, distress, misplaced trust, loss of dignity, privacy loss |\n| Family members and friends | Misuse of their face or voice, privacy loss, emotional harm |\n| Primary caregiver | Missed alerts, over-reliance on the tool, burden of setup |\n| Visitors and strangers | Being misidentified as family, having their face processed |\n\n## 4. Risk scoring\n\nSeverity (S) 1 = minor to 4 = severe harm. Likelihood (L) 1 = rare to 4 = frequent. Risk = S × L. **High** ≥ 9, **Medium** 5–8, **Low** ≤ 4.\n\n## 5. Hazard log\n\n| ID | Hazard | Cause | S | L | Risk before | Controls (code) | Risk after |\n|---|---|---|---|---|---|---|---|\n| H1 | **Wrong person named** (a stranger is called \"your son\") | Low-quality photo, look-alike, threshold too low | 4 | 3 | 12 High | Three confidence bands; margin rule (best must beat runner-up by 0.03); below threshold, says \"I'm not sure\" and never guesses; patient never sees a guess (`recognizer.band`, `identify_face`) | 4 Low |\n| H2 | **Invented memory or fact** (LLM hallucination) | LLM fills gaps with plausible fiction | 4 | 3 | 12 High | RAG with archive-only facts; system prompt rules; **post-generation grounding check** rejects unknown names, unsupported years, medical and money words; template fallback (`safety.grounding_check`, `genai_engine._generate`) | 3 Low |\n| H3 | **Face stored without consent** | Caregiver uploads photos of people who did not agree | 3 | 3 | 9 High | Enrolment blocked without `consent_photo` and a named consent giver; withdrawing consent deletes face data at once (`safety.can_enrol_face`, `update_person`) | 3 Low |\n| H4 | **Voice clone misuse** (deepfake, scam, deception) | Cloned voice used without permission or to manipulate | 4 | 2 | 8 Medium | Voice-clone consent from the voice owner only; disabled for deceased people; spoken disclosure before cloned audio; no money or OTP content ever (`safety.can_clone_voice`, `VOICE_DISCLOSURE`) | 3 Low |\n| H5 | **Distress missed** (patient frightened, lost or hurt) | AI keeps chatting instead of getting help | 4 | 3 | 12 High | Distress and urgent-word detection runs before retrieval; calm or urgent scripted reply; caregiver alert raised (`safety.support_category`, `support_reply`, `raise_alert`) | 4 Low |\n| H6 | **Re-traumatising grief** (announcing a death again) | Memory about a deceased spouse surfaced | 3 | 3 | 9 High | `status = deceased / do_not_surface`; four privacy levels (Normal, Private, Sensitive, Locked) enforced in the data layer, and any memory mentioning a protected person hidden; comforting script plus caregiver alert when asked (`memory_store.search`, `genai_engine.answer`) | 2 Low |\n| H7 | **Privacy breach** of health and biometric data | Lost laptop, shared link, curious visitor | 4 | 2 | 8 Medium | Local-only storage; Fernet encryption of media at rest; random filenames; PIN-gated caregiver API; audit log; export and erase; uploads for recognition never stored (`security.py`) | 4 Low |\n| H8 | **Medical or financial harm** (wrong dose, scam) | AI repeats a dose or asks for bank details | 4 | 2 | 8 Medium | Reminders reject doses; medicine reminders never name drugs; grounding check blocks dose, OTP, bank words (`MEDICAL_PATTERNS`, `MONEY_PATTERNS`) | 2 Low |\n| H9 | **Quizzing or patronising tone** | Model says \"don't you remember?\" | 2 | 3 | 6 Medium | Prompt rules; `safety.soften()` rewrites quiz phrases; replies capped at 60 words | 2 Low |\n| H10 | **Over-reliance**: family withdraws, AI replaces people | Tool is \"good enough\" | 3 | 2 | 6 Medium | Replies always point back to a named family member; caregiver guide; no persona or \"friend\" role-play | 4 Low |\n| H11 | **Biased recognition** (worse for darker skin, older faces) | Training-set bias in face models | 3 | 2 | 6 Medium | Family-only matching (closed set); thresholds tuned per family; \"not sure\" fallback; evaluation plan across skin tones and ages in the model card | 4 Low |\n| H13 | **Repeated questions treated as a symptom** | Software labels repetition as decline | 3 | 2 | 6 Medium | One gentle caregiver note per question per day; wording says it is common and not a symptom; no scores, trends or diagnoses (`conversation.repeat_count`, `alerts.js`) | 2 Low |\n| H14 | **Wrong memory or wrong person saved automatically** | Photo suggestions or \"teach\" saved without review | 3 | 2 | 6 Medium | Suggestions are drafts only (Save / Edit / Discard); a protected person in a photo defaults the draft to Sensitive; Teach EchoBond needs the PIN, photo consent and a named consent giver (`/api/suggest`, `/api/teach`) | 2 Low |\n| H15 | **Location guessed or disclosed** | \"Where is Priya?\" answered from memories or inferred data | 3 | 2 | 6 Medium | No location data is collected; \"Where is X?\" only repeats a visit saved in today's reminders, else \"I don't know\"; map places have coordinates only if the family typed them (`genai_engine.where_is`, `/api/places`) | 2 Low |\n| H16 | **Test activity mixed with real records** | Caregiver tries replies and triggers real alerts or logs | 2 | 3 | 6 Medium | TEST MODE runs inside `safety.quiet()` (no logs, no alerts); Demo Mode and the landing page use isolated in-browser sandboxes; screens are labelled TEST MODE | 1 Low |\n| H17 | **Family voice misused or mistaken for the real person** | A cloned voice says words the person never approved, or the patient thinks the person is really there | 4 | 2 | 8 High | Cloned or family-tuned voice only reads templates the owner approved (`voice_messages`, filled from the caregiver-set schedule); a spoken disclosure and an on-screen badge (\"Simulated with Consent\") come first; \"Can I talk to Rohan?\" alerts the caregiver and never pretends; withdrawing consent deactivates the words (`services/companion.py`) | 3 Low |\n| H12 | **System failure** (server down, model missing) | Missing dependency, power cut | 2 | 3 | 6 Medium | Every model has a fallback; health endpoint shows what's running; the app tells the user plainly; nothing safety-critical depends on the LLM | 2 Low |\n\n## 6. Safety requirements\n\n1. **SR-1** The system shall never state a person's name unless the match score is above the \"recognise\" threshold **and** beats the next candidate by the margin.\n2. **SR-2** Every patient-facing sentence shall come from saved family data or a reviewed script.\n3. **SR-3** No face embedding shall exist for a person without recorded photo consent.\n4. **SR-4** No cloned voice shall be produced without the voice owner's consent, and each cloned message shall carry a disclosure.\n5. **SR-5** Distress words shall always produce a caregiver alert.\n6. **SR-6** Sensitive memories and protected people shall be filtered out in the data layer, not only in the prompt.\n7. **SR-7** Photos and voice samples shall be encrypted at rest.\n8. **SR-8** The system shall never output drug names with doses, or ask for financial information.\n9. **SR-9** No memory, person or face shall be saved without a caregiver action (and, for faces, recorded consent).\n10. **SR-10** The system shall never state or infer where a person is, except a visit saved in reminders or the schedule the caregiver set.\n11. **SR-11** TEST MODE shall store nothing and raise no alerts.\n12. **SR-12** Fear and urgent words shall get the fixed replies \"You're safe. Let's check who is visiting today.\" and \"I think you may need help. Let's contact your caregiver.\" respectively.\n13. **SR-13** A family member's voice (cloned or device-tuned) shall only speak words that person approved, preceded by a disclosure, and never claim the person is present.\n\n## 7. Verification\n\nEach requirement maps to automated tests in `tests/` (67 backend tests) and `tests/e2e/` (12 browser tests). See [TEST_EVIDENCE.md](TEST_EVIDENCE.md) for results.\n\n## 8. Residual risks and limits\n\n- The basic (demo) face embedder is **not biometric quality**. Real use requires InsightFace and per-family threshold tuning.\n- Keyword distress detection and rule-based intents can miss unusual phrasing. The caregiver must still supervise.\n- Example mode runs the same rules in the browser (JavaScript). It is a demonstration copy; the Python backend is the reference.\n- A determined person with physical access to the computer and the caregiver PIN can see the data.\n- EchoBond has not been evaluated with patients. Any study with real participants needs ethics committee approval first.\n\n## 9. Change control\n\nAny change to thresholds, prompts, safety patterns or retrieval filters must re-run the full test-suite and update this document's version.\n", "docs/safety/PRIVACY_POLICY.md": "# EchoBond Privacy Notice\n\n**Version** 1.0 · **Effective** 3 October 2026\n\nThis notice explains, in plain language, what EchoBond collects, why, where it is kept, and how you can control it. It is written for the family and caregivers who set EchoBond up, and for anyone whose photo or voice is added.\n\n## 1. Who is responsible\n\nThe family member who installs and runs EchoBond on their own computer is in control of the data (the **Data Fiduciary** under India's Digital Personal Data Protection Act, 2023). In this student project, the EchoBond team does **not** receive, host or see any family's data.\n\n## 2. What EchoBond collects\n\n| Data | Example | Why it's needed | Sensitivity |\n|---|---|---|---|\n| Names and relationships | \"Anjali, daughter\" | To say who someone is | Personal |\n| Face photos | 1–3 photos per person | To recognise familiar people | **Biometric** |\n| Face embeddings | 512 numbers per photo | Matching without comparing raw photos | **Biometric** |\n| Voice samples | 10–30 seconds | Speaker recognition and, only with consent, a familiar voice | **Biometric** |\n| Memories | \"Mango pickle every summer\" | Personalised, grounded replies | Personal, may be sensitive |\n| Reminders | \"Evening walk, 17:30\" | Gentle orientation | Personal, may relate to health |\n| Alerts and audit log | \"Possible distress, 18:40\" | Caregiver oversight and accountability | Personal, may relate to health |\n\nEchoBond does **not** collect location, contacts, financial information, government ID numbers, or medical records.\n\n### Privacy levels for memories\n\nEach memory has one of four levels, enforced in the database layer (not only in the AI prompt):\n\n| Level | Shared with the patient | Visible to the caregiver |\n|---|---|---|\n| Normal | Yes | Yes |\n| Private | Only if the patient asks about it directly | Yes |\n| Sensitive | Never | Yes |\n| Locked | Never | Only after entering the PIN (each unlock is logged) |\n\nA memory that mentions a protected person (for example, someone who has died) is never shared with the patient, whatever its level.\n\n## 3. What EchoBond does not keep\n\n- **Camera frames used for recognition are processed in memory and discarded.** They are never saved.\n- Questions asked in Talk to EchoBond are kept in the interaction log (the question, a normalised form used to notice repeated questions, and which memories were used), so the caregiver can see what happened.\n- EchoBond never records anyone's location. Places on the memory map are only those the family typed in.\n- TEST MODE (Try as Kamala, Demo Mode) keeps nothing.\n\n## 4. Where data is stored\n\n- Everything stays **on the family's own computer**, in the `data/` folder.\n- Photos and voice samples are **encrypted** (Fernet, AES-128 with HMAC) and saved under random filenames.\n- If a cloud language model is turned on (Gemini or Groq), **only the question and the few retrieved memory sentences** are sent to it, never photos, voices or embeddings. Families who don't want any text to leave the computer should use the offline template mode or a local model (Ollama).\n\n## 5. Lawful basis and consent\n\n- The patient's consent is obtained where they can give it. Where they can't, consent comes from their **lawful guardian** (DPDP Act Section 9 and the rules made under it, and guardianship provisions under the Rights of Persons with Disabilities Act, 2016).\n- **Every person whose face or voice is added consents for themselves.** A caregiver can't consent on someone else's behalf unless they are that person's guardian.\n- See [CONSENT_FORMS.md](CONSENT_FORMS.md).\n\n## 6. Your rights, and how to use them in the app\n\n| Right | How |\n|---|---|\n| Know what's held | Caregiver area → **Export** (`GET /api/export`) |\n| Correct it | Edit the person or memory |\n| Withdraw consent | Untick consent: face or voice data is **deleted immediately** |\n| Erase everything | `POST /api/erase-all` with `{\"confirm\":\"ERASE\"}`. Files are overwritten before deletion |\n| Complain | Contact the family's grievance contact (Section 9 below), then the Data Protection Board of India |\n\n## 7. Retention\n\n| Data | Kept for |\n|---|---|\n| Photos, voices, embeddings | Until consent is withdrawn or the person is removed |\n| Memories, reminders | Until deleted by the caregiver |\n| Alerts | 90 days recommended, then delete |\n| Audit log | 1 year recommended |\n\n## 8. Security\n\nCaregiver PIN on every change, encrypted media, no personal data in filenames, `no-store` caching on the API, the server listening on `127.0.0.1` only by default, and a full audit log. Change the default PIN before real use.\n\n## 9. Contact\n\nEach family should write their grievance contact here: **Name ________ · Phone ________ · Email ________**\n\nProject team contact: Department of Networking and Communications, School of Computing (faculty in charge: Dr. Vaishnavi Moorthy, Dr. R. Swathy).\n", "docs/safety/CONSENT_FORMS.md": "# EchoBond Consent Forms\n\nPrint, read aloud if needed, and keep signed copies. Consent can be withdrawn at any time, and withdrawal is honoured immediately in the app.\n\n---\n\n## Form A: Patient consent (or guardian consent on the patient's behalf)\n\n**Name of the person using EchoBond:** ______________________\n\nI understand that:\n\n- [ ] EchoBond is a memory **support tool**. It is not a doctor and not a medical device.\n- [ ] My family will save photos, names, voices and memories so EchoBond can help me recognise people.\n- [ ] EchoBond may speak to me. If it uses a family member's recorded voice, it will say so first.\n- [ ] My information stays on my family's computer and is protected with a PIN and encryption.\n- [ ] I can ask for EchoBond to be switched off, or my information deleted, at any time.\n\n**Easy-read summary, to be read aloud:** *\"This is a helper on the computer. It can show you who people are and tell you happy memories your family saved. It will always tell you to ask your family if it isn't sure. You can say stop at any time.\"*\n\n| | Patient | Guardian / nominated representative (if the patient cannot consent) |\n|---|---|---|\n| Name | | |\n| Relationship to patient | self | |\n| Basis of authority | n/a | Guardianship order / nominated representative / other: ____ |\n| Signature or thumb impression | | |\n| Date | | |\n\n**Witness** (not the guardian): Name __________ Signature __________ Date ______\n\nAssent check, completed by the person setting up: Did the patient seem comfortable? ☐ Yes ☐ Unsure ☐ No. **If \"No\", do not proceed.**\n\n---\n\n## Form B: Family member or friend: face recognition consent\n\n**Your name:** ______________________ **Relationship to the patient:** ______________________\n\n- [ ] I agree that up to **3 photos of my face** can be stored, encrypted, on the family computer.\n- [ ] I understand EchoBond turns my photos into a list of numbers (an embedding) to recognise me.\n- [ ] I understand my photos are never uploaded to the internet by EchoBond.\n- [ ] I know I can withdraw. My photos and face data will then be deleted immediately.\n\nSignature __________ Date ______ (For a child: parent or guardian signs here: __________)\n\n---\n\n## Form C: Voice donor consent (voice cloning)\n\n**Your name:** ______________________\n\nVoice cloning means the computer can make new sentences that sound like you. Please read carefully.\n\n- [ ] I agree to record a **10–30 second** voice sample.\n- [ ] I agree EchoBond may speak **only to the patient**, only **short memory and reassurance messages**, in a copy of my voice.\n- [ ] I understand every cloned message starts with a short disclosure: \"EchoBond, in [my name]'s recorded voice.\"\n- [ ] I understand my voice will **never** be used to ask for money, passwords or OTPs, to give medical instructions, or to say anything outside the saved memories.\n- [ ] I understand voice cloning is switched off automatically if I pass away, and my family must re-confirm in writing before it is used again.\n- [ ] I can withdraw at any time, and my voice sample will be deleted immediately.\n\n☐ I agree to **speaker recognition only** (EchoBond recognises my voice but never copies it).\n☐ I agree to **speaker recognition and voice cloning**.\n\nSignature __________ Date ______\n\n---\n\n## Form D: Withdrawal of consent\n\nI, ______________________, withdraw my consent for: ☐ face recognition ☐ voice recognition ☐ voice cloning ☐ all EchoBond use of my data.\n\nSignature __________ Date ______\n\n**For the caregiver:** in the app, untick the matching consent box (or delete the person). Then record here: Done by ________ on ________ (the audit log entry will read `update_person` or `delete_person`).\n", "docs/safety/DPIA.md": "# Data Protection Impact Assessment (DPIA)\n\n**System** EchoBond v2.0 · **Date** 3 October 2026 · **Prepared by** EchoBond project team · **Review** before any pilot with real participants\n\nA DPIA is required because EchoBond processes **biometric data** (faces, voices) and **health-related data** about a **person who may lack capacity**. Those are three high-risk factors together.\n\n## 1. Legal and ethical frameworks considered\n\nThis assessment is written **with reference to** the frameworks below. It is a student project document, not a legal opinion, and EchoBond has not been reviewed by a lawyer or regulator.\n\n- **Digital Personal Data Protection Act, 2023 (India)** and the Digital Personal Data Protection Rules, 2025: consent, notice, purpose limitation, data minimisation, security safeguards, the rights of Data Principals, and lawful-guardian consent for persons with disability (Section 9).\n- **Rights of Persons with Disabilities Act, 2016**: supported decision-making and limited guardianship.\n- **ICMR Ethical Guidelines for Application of AI in Biomedical Research and Healthcare (2023)**: autonomy, safety, trustworthiness, data privacy, accountability, inclusiveness.\n- **WHO, Ethics and Governance of AI for Health (2021)**: six guiding principles.\n- **Medical Devices Rules, 2017 (CDSCO)**: EchoBond is designed with **no medical purpose** (no diagnosis, monitoring or treatment). Any change to that would need regulatory review.\n- For comparison: GDPR Article 9 (special-category data) and the EU AI Act's rules on biometric identification.\n\n## 2. Description of processing\n\n| Item | Detail |\n|---|---|\n| Purpose | Help one person living with Alzheimer's recognise their own family and recall shared memories |\n| Data subjects | The patient; consenting family members, friends and carers |\n| Data | Names, relationships, face photos and embeddings, voice samples and embeddings, written memories, reminders, alerts, audit log |\n| Source | Entered by the caregiver; faces and voices from the people themselves |\n| Recipients | None by default. Optional: cloud LLM receives the question and up to 3 memory sentences |\n| Storage | Local SQLite + encrypted files on the family computer |\n| Retention | See the Privacy Notice, Section 7 |\n\n## 3. Necessity and proportionality\n\n- **Closed-set recognition only**: EchoBond matches against *the family's own* enrolled people. It cannot identify strangers, and it isn't connected to any public database.\n- **Minimisation**: 1–3 photos per person; recognition frames are never stored; no location, contacts or finance.\n- **Alternatives considered**: printed photo albums with labels (kept as a recommended companion); caregiver-only apps (don't help the patient directly). EchoBond adds value by being on-demand and personalised, while keeping the caregiver in control.\n\n## 4. Risks to people and mitigations\n\n| Risk | Likelihood | Impact | Mitigation | Residual |\n|---|---|---|---|---|\n| Unauthorised access to biometric data | Low | High | Encryption at rest, PIN, localhost-only server, audit log | Low |\n| Consent not genuinely informed (patient capacity) | Medium | High | Easy-read form, guardian route, assent check, stop at any sign of discomfort | Medium |\n| Function creep (used to track people) | Low | High | Closed-set design; no camera recording; no location | Low |\n| Text sent to cloud LLM | Medium (if enabled) | Medium | Off by default; only minimal text; offline/local options | Low |\n| Inaccurate data causing distress | Medium | Medium | Caregiver review; sensitive flag; grounding check | Low |\n| Voice deepfake misuse | Low | High | Voice-owner consent; disclosure; no clone after death; no money talk | Low |\n| Inability to exercise rights | Low | Medium | Export, edit, withdraw, erase built into the app | Low |\n\n## 5. Data subject rights\n\n| Right | Supported by |\n|---|---|\n| Information / access | `GET /api/export` |\n| Correction | `PATCH /api/people/{id}`, memory delete and re-add |\n| Erasure | `DELETE /api/people/{id}`, `POST /api/erase-all` (files overwritten, then unlinked) |\n| Withdraw consent | Untick consent → immediate deletion of face or voice data |\n| Grievance | Named family contact; Data Protection Board of India |\n| Nominate | The patient or guardian can nominate a person to exercise these rights |\n\n## 6. Security measures\n\nFernet encryption (AES-128-CBC + HMAC-SHA256) for media; the key is stored in `data/.fernet.key` with 0600 permissions or supplied by environment variable; constant-time PIN check; upload size and type limits; random file names; `no-store` caching; `nosniff`; `Permissions-Policy` limiting camera and microphone to the app; a default bind to 127.0.0.1.\n\n## 7. Outcome\n\n**Proceed for classroom demonstration with illustrated (synthetic) people only.** Before any use with real families, the team must: (1) obtain Institutional Ethics Committee approval; (2) switch to InsightFace and tune thresholds with consenting participants; (3) change the default PIN and keep the key backed up separately; (4) repeat this DPIA.\n\n| Role | Name | Signature | Date |\n|---|---|---|---|\n| Project lead | | | |\n| Faculty in charge | | | |\n", "docs/safety/AI_VOICE_POLICY.md": "# AI Voice and Voice-Cloning Policy\n\nHearing a familiar voice can calm and orient a person with dementia. A cloned voice is also one of the most misusable things a generative AI can make. These rules decide when EchoBond may speak in someone's voice.\n\n## 1. Three levels of voice use\n\n| Level | What it does | Who must consent |\n|---|---|---|\n| 0. Generic voice | Browser or pyttsx3 voice, slow (rate 0.86) | Nobody (default) |\n| 1. Speaker recognition | Recognises *who is speaking* (Resemblyzer d-vector) | The speaker (Form C, first box) |\n| 2. Voice cloning | Reads that person's **own approved words** in their voice (Coqui XTTS-v2 locally, or ElevenLabs if the family chooses) | **The voice owner themself** (Form C, second box) |\n\n## 2. Hard rules (enforced in code)\n\n1. **Owner consent only.** `can_clone_voice()` requires `consent_voice_clone = 1` on the voice owner's own record. A caregiver can't turn it on for someone else.\n2. **Never for the deceased.** Cloning is automatically disabled when a person's status isn't `active`. Re-enabling it needs the family's written agreement and an ethics discussion.\n3. **Disclosure.** When `VOICE_DISCLOSURE=on` (the default), each cloned message starts: *\"EchoBond, in Anjali's recorded voice.\"*\n4. **Content limits.** Cloned speech only reads text that has already passed the grounding check: saved memories, names and reassurance. It never covers money, passwords, OTPs, medicines or doses, or instructions to go somewhere.\n5. **Withdrawal deletes.** Unticking consent securely deletes the voice sample and its embedding.\n6. **No export.** There is no API to download a voice sample or generated audio file.\n\n## 2a. Approved words: how \"Where is Rohan?\" works\n\nEchoBond never writes new first-person sentences for a family member. Instead:\n\n1. In the People vault (`/care/people`), Rohan approves short message templates himself, for example *\"{patient}, I'm {where} right now. I'll be home by {back_at}. Love you.\"* The caregiver records who approved them; only `{patient}`, `{where}` and `{back_at}` may be filled in, and templates mentioning money, OTPs, medicines or unknown placeholders are refused.\n2. The blanks are filled only from the schedule the caregiver set (for example weekdays 09:00 to 18:30, \"at the office\", home by 19:00). With no schedule entry, EchoBond says it doesn't know.\n3. EchoBond first says, in its own voice, *\"Here's a message Rohan left for you.\"* The screen shows a badge: *\"Speaking in Rohan's Voice (Simulated with Consent)\"*, or *\"Rohan's own approved words, read by the device voice\"* when no cloning engine is available.\n4. \"Can I talk to Rohan?\" plays the message (if any) and then tells the caregiver the patient wants to talk to him. EchoBond never pretends Rohan is on the line.\n5. Without consent, or without approved words, EchoBond answers in its own voice, in the third person.\n\n### Providers\n\n| Provider | Setting | Notes |\n|---|---|---|\n| Device / browser voice | `TTS_PROVIDER=browser` (default) | Reads approved words with pitch tuned to the person's sample. Not their real voice, and the badge says so. |\n| Coqui XTTS-v2 | `TTS_PROVIDER=xtts` | Runs locally; the reference clip (15 to 60 s WAV) never leaves the computer. Check the model's licence before any real use. |\n| ElevenLabs | `ELEVENLABS_API_KEY=...` | The reference clip and the filled-in words are sent to ElevenLabs' servers. Use only if the voice owner agrees to that in writing. |\n\nBark is not offered: it has no supported way to copy a voice from a reference clip.\n\n## 3. The deception question\n\nSome carers argue a cloned voice \"pretending\" to be family is deceptive. Our position:\n\n- EchoBond **never role-plays** a family member in conversation. It speaks *as EchoBond*, using the family voice only for comfort.\n- The disclosure line is on by default. A family may turn it off only after discussing it with the patient's clinician, and that choice is logged.\n- If the patient seems confused about whether the real person is present, the caregiver should switch to the generic voice.\n\n## 4. Scam and deepfake protection advice for families\n\n- Tell relatives: **\"EchoBond will never ask for money or OTPs in my voice.\"**\n- Keep the computer locked, and change the default caregiver PIN.\n- Don't share voice samples on messaging apps.\n", "docs/safety/ETHICS_STATEMENT.md": "# Ethics Statement\n\nEchoBond is built for someone who may not be able to judge whether the technology is right, wrong, or confused. That puts the full ethical responsibility on its designers and on the family who use it.\n\n## Our principles\n\n1. **Dignity first.** The patient is an adult with a life story. EchoBond never quizzes (\"Who is this? Don't you remember?\"), never corrects harshly, and never talks down.\n2. **People over the machine.** Every uncertain or emotional moment is handed back to a real person, by name (\"Let's ask Anjali together\"). EchoBond adds to human care. It does not replace it.\n3. **Truthful, but kind.** EchoBond only says things the family saved. It never invents. It also never forces painful truths: it won't announce a death again, and it lets the family decide how losses are discussed.\n4. **Consent from everyone involved.** The patient (or guardian) agrees to use it. Every person whose face or voice is stored agrees for themselves.\n5. **Privacy by default.** Local storage, encryption, and the minimum data needed.\n6. **Fairness.** Face recognition models are known to perform unevenly across skin tones and ages. EchoBond's closed-set, family-only design, \"not sure\" fallback, and per-family tuning reduce that risk. We commit to testing across groups before any real use.\n7. **Transparency.** The app always shows whether it's in demo or live mode, which model wrote each reply, and which memories were used.\n8. **Accountability.** Every change is audit-logged. Each safety rule is linked to a hazard and a test.\n\n## Contribution to SDG 3\n\nEchoBond supports **Sustainable Development Goal 3 (Good Health and Well-being)**, target 3.4 (promote mental health and well-being), by reducing distress and social disconnection for people living with dementia and by supporting their caregivers.\n\n## Research ethics\n\nThis is a classroom prototype using only **illustrated, fictional people**. Any study involving real patients or families requires prior approval from an Institutional Ethics Committee under the ICMR National Ethical Guidelines, with informed consent and a clinician involved.\n\n## Use of AI in building this project\n\nGenerative AI tools assisted with parts of the code and documentation. The team reviewed, tested and is responsible for all of it.\n", "docs/safety/MODEL_CARD.md": "# Model Card: EchoBond v2.0\n\nEchoBond combines several pre-trained models. It does **not** train a new foundation model. Its \"personalised memory model\" (stage 04) is a per-family matching layer over embeddings.\n\n## Intended use\n\n- **Users:** one person living with mild-to-moderate Alzheimer's disease, supervised by a caregiver at home.\n- **Use:** recognise **enrolled family members**, recall **family-written** memories, and give gentle orientation.\n- **Out of scope:** identifying strangers; surveillance; diagnosis, symptom tracking or medication management; unsupervised use; use with people who have not consented.\n\n## Components\n\n| Stage | Component | Default model | Fallback (offline / no GPU) |\n|---|---|---|---|\n| 03 Image | Face detection + embedding | InsightFace `buffalo_l` (RetinaFace + ArcFace, 512-d) | OpenCV Haar + colour/gradient descriptor (**demo only**) |\n| 03 Image | Photo captioning | BLIP base (Salesforce) | none (caregiver writes captions) |\n| 03 Speech | Speech-to-text | Whisper small | Browser Web Speech API |\n| 03 Speech | Speaker embedding | Resemblyzer GE2E d-vector | disabled |\n| 03 Text | Sentence embedding | all-MiniLM-L6-v2 (384-d) | Hashed bag-of-words (384-d) |\n| 04 | Matching | Cosine similarity, top-2 mean, 3 bands + margin | same |\n| 05 | Conversation intents | Rules: support categories, protected people, who-else, who-is, where-is, follow-ups (4 turns / 15 min) | same |\n| 05 | Text generation | Gemini 2.0 Flash / Llama 3.1 8B (Groq or Ollama) | Template generator |\n| 05 | Speech synthesis | Coqui XTTS-v2 (consented voices only) | pyttsx3 / browser voice |\n\n## Decision thresholds\n\n| Embedder | Recognise | Not sure | Margin |\n|---|---|---|---|\n| ArcFace (InsightFace) | ≥ 0.55 | 0.40–0.55 | 0.03 |\n| Demo descriptor | ≥ 0.88 | 0.75–0.88 | 0.03 |\n\nCaregivers can **raise** the recognise threshold in Settings (for example after a mix-up) but can never set it below the default; the server rejects lower values. Thresholds favour **false \"not sure\"** over **false names**. Calling a stranger \"your son\" is far more harmful than saying \"Let's ask Anjali.\"\n\n## Evaluation\n\n**Demo data (illustrated portraits, this repo):** 5/5 living family members recognised (scores 0.93–0.97); the unknown visitor was rejected (0.58); the deceased family member was routed to the protected reply. Best wrong-person score: 0.76.\n\n**Required before real use (evaluation plan):**\n\n| Metric | Target |\n|---|---|\n| False name rate (wrong person named) | < 0.5% of attempts |\n| Correct recognition rate (good light, frontal) | > 90% |\n| \"Not sure\" rate | report it; there is no hard target, but a high rate means more photos are needed |\n| Grounding pass rate of LLM replies | > 95%; failures fall back safely |\n| Distress detection recall on a 200-phrase test set | > 90% |\n\nReport results **separately by skin tone (Monk scale), age group, glasses or no glasses, and lighting**.\n\n## What the AI is not allowed to do (enforced in code)\n\n- Name anyone below the threshold or without the margin.\n- Say anything not in the family's saved records (grounding check; template fallback).\n- Share SENSITIVE or LOCKED memories with the patient, or PRIVATE ones unless asked directly.\n- Guess where a person is: \"Where is Priya?\" only repeats a visit saved in today's reminders.\n- Diagnose, give medical advice, name drugs or doses, or ask about money.\n- Save a memory or a new person by itself: suggestions and Teach EchoBond need the caregiver.\n- Use a family member's voice without that person's own recorded consent.\n\n## Known limitations\n\n- Familiar voice: the example family has no real voice clips, so the device voice reads the approved words. Cloned audio quality depends on the clip and the engine; it is never used for anything but approved words.\n\n- The demo descriptor recognises *these illustrations*, not real faces robustly.\n- Ageing, illness or new glasses can lower scores. Re-enrol a person every few months.\n- Keyword distress detection and rule-based intents miss indirect language.\n- Repeated-question counting compares word sets, so very different wordings of the same question count separately.\n- Retrieval with the hashed fallback is keyword-like. MiniLM gives better semantic matches.\n\n## Ethical considerations\n\nSee [ETHICS_STATEMENT.md](ETHICS_STATEMENT.md) and [SAFETY_CASE.md](SAFETY_CASE.md).\n", "docs/safety/INCIDENT_RESPONSE.md": "# Incident Response Plan\n\nWhat to do when something goes wrong. Keep a printed copy next to the computer.\n\n## Severity levels\n\n| Level | Examples | Response time |\n|---|---|---|\n| **P1 Urgent** | Patient says they fell, are hurt, or can't breathe. A stranger was named as family and the patient went with them. Data was stolen. | **Immediately** |\n| **P2 High** | Wrong name given; invented memory; patient visibly distressed by a reply; cloned voice used without consent | Same day |\n| **P3 Normal** | Repeated \"not sure\" for a known person; reminder at the wrong time; app not starting | Within a week |\n\n## P1: Patient safety emergency\n\n1. **Go to the patient.** The app is not a safety device.\n2. If needed, call **112** (India emergency number), or **102 / 108** for an ambulance.\n3. Afterwards, open Caregiver → Alerts, mark it seen, and note what happened.\n\n## P2: Wrong or harmful output\n\n1. Comfort the patient. Don't argue about what the app said.\n2. Switch on **Patient view** or close the app until it's reviewed.\n3. Record: time, what was shown or said, the photo or question, and the confidence shown.\n4. Fix the cause: add 2–3 better photos, edit or mark the memory sensitive, or set the person's status to protected.\n5. For a wrong name: raise the recognise threshold (`FACE_RECOGNIZE_THRESHOLD`) and re-run `python -m pytest`.\n\n## Data breach (lost laptop, unknown access)\n\n1. Change the caregiver PIN (`CAREGIVER_PIN` in `.env`) and restart.\n2. Check **Audit log** for actions you didn't make.\n3. If the device is lost: the media files are encrypted, but names and memories in the database are not. Tell every person whose data was stored.\n4. Where the DPDP Act applies, the Data Fiduciary must inform the Data Protection Board and the affected people.\n5. Rotate the encryption key: export your data, run erase-all, set a new `ECHOBOND_ENCRYPTION_KEY`, and re-enrol.\n\n## Voice misuse\n\n1. Untick voice consent for that person. The sample is deleted immediately.\n2. Tell the voice owner and family.\n3. Remind relatives that EchoBond never asks for money or OTPs.\n\n## Incident record\n\n| Date/time | Level | What happened | Patient impact | Action taken | By |\n|---|---|---|---|---|---|\n| | | | | | |\n", "docs/safety/CAREGIVER_GUIDE.md": "# Caregiver Guide: Using EchoBond Safely\n\n## Before you start\n\n- Talk with your loved one about EchoBond in a calm moment. Use the easy-read summary in Consent Form A.\n- Ask each family member before adding their photo or voice (Forms B and C).\n- **Change the PIN** from 2468 to your own (`CAREGIVER_PIN` in the `.env` file).\n\n## Adding people\n\n- Use **2–3 clear, recent, front-facing photos** in good light, one face per photo.\n- Write one gentle line about each person: \"She lives with you and makes your morning tea.\"\n- Add nicknames your loved one uses (\"Pihu\", \"Anju\").\n\n## Writing memories\n\n- Write the way you'd tell them: short, warm, in the present tense where possible.\n- Choose **happy, settled memories**. Avoid arguments, illness and losses.\n- Give each memory a **privacy level**:\n  - **Normal**: EchoBond can share it.\n  - **Private**: shared only if your loved one asks about it directly.\n  - **Sensitive**: never shared with your loved one. Use it for anything painful.\n  - **Locked**: never shared, and you need the PIN even to read it. Every unlock is logged.\n- **Suggest from a photo** drafts a memory from the people EchoBond recognises. Nothing is saved until you press Save (or Edit, or Discard).\n- For someone who has passed away, set their status to **protected**. EchoBond will never announce the loss, and it will alert you if they're asked about.\n\n## Day to day\n\n- Stay nearby the first few times. Watch how your loved one reacts.\n- If EchoBond says **\"I'm not sure\"**, that's working as designed. Add better photos later.\n- If a new person comes often, use **Teach EchoBond** (it needs your PIN and that person's consent).\n- Use **Try as Kamala** to hear exactly what EchoBond would say. It's TEST MODE: nothing is stored and no alerts are sent.\n- **Ask EchoBond** (in the caregiver area) answers questions like \"What happened today?\" only from EchoBond's own records.\n- A **repeated question** note means the same question came up several times (3 times in 24 hours by default; you can change this in Settings). It is not a diagnosis. You can add a reminder or a memory that answers it, review the conversation, or dismiss it.\n- Check **Alerts** every day. \"Possible distress\" means your loved one said something like \"I'm scared\". EchoBond replied \"You're safe. Let's check who is visiting today.\" For words like \"I fell\", it replied \"I think you may need help. Let's contact your caregiver.\" and raised an urgent alert. Go to them.\n- Evenings can be harder (\"sundowning\"). EchoBond's home screen notes evening mode and keeps prompts short, but people matter most then.\n\n## Never\n\n- Never leave your loved one alone with EchoBond as their only company.\n- Never put medicine names or doses in reminders.\n- Never use EchoBond to test or quiz them.\n- Never treat EchoBond as a medical device or a safety guarantee. It doesn't diagnose, monitor or treat anything.\n\n## If something goes wrong\n\nSee [INCIDENT_RESPONSE.md](INCIDENT_RESPONSE.md). In an emergency, call **112**.\n\n## Helpful organisations (India)\n\n- **ARDSI** (Alzheimer's and Related Disorders Society of India): support groups and caregiver training.\n- **Tele-MANAS: 14416** (national mental health helpline), for caregiver stress too.\n", "docs/safety/TEST_EVIDENCE.md": "# Test Evidence\n\nRun everything yourself:\n\n```\npython tests/run_all.py              # 67 backend tests (no pytest needed; python -m pytest -q also works)\npython tests/e2e/test_frontend.py    # 12 browser tests (needs Playwright and Chromium)\n```\n\nThe last recorded run used the fictional demo family in offline mode (template generator, basic face descriptor).\n\n**Result: 67 of 67 backend tests and 12 of 12 browser tests passed.** Run date: 5 October 2026.\n\nThe Next.js app (`web/`) has 6 grounding unit tests (`npm test`, 6 of 6 pass), and every route (`/`, `/patient`, `/patient/lens`, `/patient/talk`, `/patient/memories`, `/patient/routine`, `/care`, `/care/people`) was driven in Chromium against a test bundle with no script errors. `next build` itself could not be run here (no npm registry access).\n\n## Core safety (`tests/test_echobond.py`, 21 tests)\n\n| Test | Hazard / requirement | What it proves | Result |\n|---|---|---|---|\n| `test_health_reports_components` | H12 | The app reports which models are active, so demo mode is never mistaken for production | PASS |\n| `test_recognizes_every_living_family_member` | Function | All 5 enrolled family members are recognised from a *different* image than the ones enrolled | PASS |\n| `test_H1_stranger_is_never_named` | H1, SR-1 | An unknown visitor gets \"I'm not sure\" and no family name | PASS |\n| `test_H6_deceased_person_is_not_announced` | H6, SR-6 | A late husband's photo or name never triggers \"passed away\"; the caregiver is alerted | PASS |\n| `test_H6_sensitive_memories_hidden_from_patient` | H6, SR-6 | Sensitive memories are filtered in the data layer for the patient | PASS |\n| `test_H2_grounding_rejects_invented_facts` | H2, SR-2 | Unknown names and years not in the archive are rejected | PASS |\n| `test_H2_llm_hallucination_falls_back_to_template` | H2, SR-2 | A hallucinated LLM reply (\"Paris with Mr. Kapoor in 2001\") is discarded and replaced | PASS |\n| `test_H8_no_medical_or_money_content` | H8, SR-8 | Doses, OTP and bank words are blocked; dose reminders are refused | PASS |\n| `test_H5_distress_triggers_calm_reply_and_alert` | H5, SR-5 | \"I'm scared\" and \"I fell\" produce calm or urgent replies plus alerts | PASS |\n| `test_H7_caregiver_endpoints_need_pin` | H7 | Archive changes, the audit log and erase need the PIN | PASS |\n| `test_H3_consent_required_for_face_enrolment` | H3, SR-3 | No face enrolment without consent and a named consent giver | PASS |\n| `test_H3_consent_withdrawal_deletes_face_data` | H3 | Withdrawing consent deletes the embeddings and media | PASS |\n| `test_H4_voice_clone_requires_consent` | H4, SR-4 | Cloning needs the owner's consent and is off for deceased people | PASS |\n| `test_media_is_encrypted_at_rest` | H7, SR-7 | Stored photos are not readable PNG files on disk | PASS |\n| `test_memory_chat_answers_from_archive` | H2 | Chat answers come from saved memories; off-topic questions get \"I don't have a memory saved\" | PASS |\n| `test_context_has_orientation` | Stage 06 | Greeting and date orientation are present | PASS |\n| `test_dashboard_stats_and_interactions` | H7, oversight | Dashboard stats need the PIN; every recognition outcome is logged | PASS |\n| `test_memory_and_reminder_updates` | H6 | Marking a memory sensitive hides it from the patient immediately | PASS |\n| `test_preview_does_not_log_or_alert` | H5, oversight | Caregiver previews never create alerts or log entries; without the PIN, \"preview\" is ignored | PASS |\n| `test_daily_notes` | Oversight | Notes need a valid mood and the PIN | PASS |\n| `test_export_and_erase` | Rights | Export works; erase needs explicit confirmation, then removes everything | PASS |\n\n## Archive and privacy levels (`tests/test_v2_archive.py`, 11 tests)\n\n| Test | Hazard / requirement | What it proves | Result |\n|---|---|---|---|\n| `test_patient_sees_only_normal_memories_about_active_people` | H6, SR-6 | The patient's memory list shows only NORMAL memories; PRIVATE, SENSITIVE and LOCKED ones are left out | PASS |\n| `test_memory_about_protected_person_is_hidden_even_if_normal` | H6, SR-6 | A memory that mentions any protected person is hidden from the patient, whatever its level | PASS |\n| `test_locked_memory_needs_unlock_and_is_audited` | H7 | LOCKED content is withheld until the caregiver unlocks it with the PIN; each unlock is in the audit log | PASS |\n| `test_memory_with_many_people_place_song_and_validation` | Function | Memories link several people, a place and a song; bad input gets a friendly message | PASS |\n| `test_places_never_get_invented_coordinates` | Memory map | A place without coordinates stays without them; latitude needs longitude | PASS |\n| `test_family_graph_hides_protected_people_from_patient` | H6 | The relationship graph shown to the patient leaves out protected people | PASS |\n| `test_settings_can_raise_but_never_lower_face_threshold` | H1, SR-1 | A caregiver can raise the naming threshold but never set it below the default | PASS |\n| `test_raised_threshold_turns_a_match_into_not_sure` | H1, SR-1 | Raising the threshold turns a borderline match into “I'm not sure” | PASS |\n| `test_errors_are_friendly_and_never_raw` | H12 | API errors return plain-language messages, never stack traces | PASS |\n| `test_reminder_done_and_dose_rules` | H8, SR-8 | Reminders can be marked done without the PIN; a reminder containing a dose is refused | PASS |\n| `test_v1_database_migrates_without_data_loss` | H12 | A version 1 database is upgraded in place with nothing lost | PASS |\n\n## Conversation, support and oversight (`tests/test_v2_conversation.py`, 13 tests)\n\n| Test | Hazard / requirement | What it proves | Result |\n|---|---|---|---|\n| `test_follow_up_questions_use_conversation_context` | Function | “Who is Rohan?” → “What did we do together?” → “Who else was there?” stay on one thread | PASS |\n| `test_who_else_without_context_does_not_guess` | H2 | A follow-up with nothing to refer to asks which memory instead of guessing | PASS |\n| `test_every_answer_explains_itself_with_real_records` | H2, SR-2 | Every reply's “Why?” list points to real person and memory records | PASS |\n| `test_private_memory_only_when_asked_directly` | H6 | PRIVATE memories appear only when the question is clearly about them | PASS |\n| `test_sensitive_and_locked_memories_never_reach_chat` | H6, SR-6 | SENSITIVE and LOCKED memories never appear in any patient reply | PASS |\n| `test_support_categories_give_grounded_calm_replies` | H5, SR-5 | Fear, confusion, frustration, sadness and urgent words get the fixed calm replies and a caregiver alert | PASS |\n| `test_repeated_question_raises_one_alert_per_day` | Oversight | The same question asked 3 or more times raises one gentle caregiver note per day, with no diagnosis | PASS |\n| `test_repeated_threshold_setting_is_respected` | Oversight | The caregiver's repeat threshold is honoured | PASS |\n| `test_test_mode_never_stores_or_alerts` | Oversight | TEST MODE (Try as Kamala) stores nothing and sends no alerts | PASS |\n| `test_memory_lens_explains_and_lists_only_visible_memories` | H6, SR-2 | Memory Lens explains each match and lists only memories the patient may see | PASS |\n| `test_assistant_only_reports_records` | H2 | The caregiver assistant answers only from database records | PASS |\n| `test_daily_summary_counts_real_activity` | H2 | The daily summary counts real logged activity | PASS |\n| `test_where_is_never_guesses_a_location` | H2, privacy | “Where is Priya?” only repeats a visit saved in today's reminders; otherwise EchoBond says it doesn't know | PASS |\n\n## Memory Lens, Teach EchoBond and suggestions (`tests/test_v2_lens.py`, 7 tests)\n\n| Test | Hazard / requirement | What it proves | Result |\n|---|---|---|---|\n| `test_view_memory_respects_privacy` | H6 | Opening a memory directly obeys the same privacy rules | PASS |\n| `test_teach_requires_caregiver_and_consent` | H3, SR-3 | Teach EchoBond needs the caregiver PIN, photo consent and a named consent giver | PASS |\n| `test_teach_turns_unknown_into_known` | Function | After teaching, the same face is recognised | PASS |\n| `test_suggestions_never_save_anything` | Oversight | Photo suggestions are drafts only; nothing is saved until the caregiver presses Save | PASS |\n| `test_suggestion_does_not_invent_people_or_events` | H2 | An unknown face is not named, and without a photo description no event or text is invented | PASS |\n| `test_suggestion_with_protected_person_defaults_to_sensitive` | H6 | A suggestion containing a protected person defaults to SENSITIVE and doesn't tag them | PASS |\n| `test_saving_a_suggestion_with_photo_attached` | Function | A saved suggestion keeps its photo, encrypted | PASS |\n\n## Family vault and familiar voice (`tests/test_v3_vault_voice.py`, 15 tests)\n\n| Test | Hazard / requirement | What it proves | Result |\n|---|---|---|---|\n| `test_vault_upload_ingests_faces_voice_memories_and_schedule` | Function | One upload creates the profile, finds a face box and embedding per photo, measures the voice clip and saves memories and schedule | PASS |\n| `test_vault_refuses_media_without_consent_and_bad_inputs` | SR-3, SR-4 | Photos without photo consent and a voice clip without voice consent are refused | PASS |\n| `test_voice_clip_must_be_15_to_60_seconds` | Quality | Clips shorter than 15 s or longer than 60 s are rejected with a plain reason | PASS |\n| `test_approved_words_need_consent_owner_approval_and_safe_content` | H17, SR-13 | Approved words need the owner's voice consent, owner approval and a named approver, and may not mention money, medicine or unknown placeholders | PASS |\n| `test_recognize_returns_face_box_and_image_size_for_the_hud` | Function | `/api/recognize` returns the face box and image size the HUD uses | PASS |\n| `test_uncertain_match_never_gives_the_patient_a_name` | H1, SR-1 | An uncertain match carries no name for the patient | PASS |\n| `test_where_is_rohan_speaks_only_his_approved_words_with_disclosure` | H17, SR-13 | \"Where is Rohan?\" plays a disclosure, then only Rohan's approved words filled from his schedule | PASS |\n| `test_can_i_talk_to_rohan_alerts_the_caregiver_and_never_pretends` | H17 | \"Can I talk to Rohan?\" alerts the caregiver and never claims Rohan is on the line | PASS |\n| `test_without_voice_consent_echobond_answers_in_its_own_voice` | SR-4 | No consent means EchoBond's own voice, third person | PASS |\n| `test_withdrawing_voice_consent_stops_the_approved_words` | Rights | Withdrawing consent switches the approved words off at once | PASS |\n| `test_no_schedule_means_no_guess_and_protected_people_stay_protected` | H15, SR-10 | No schedule means \"I don't know\"; protected people are never voiced | PASS |\n| `test_distress_comes_first_even_when_asking_for_someone` | H5, SR-12 | Fear words get the fixed reply before any family voice | PASS |\n| `test_audio_falls_back_to_the_browser_voice_when_no_engine_is_installed` | H12 | With no cloning engine the audio route returns 204 and the device voice is used | PASS |\n| `test_voice_chat_preview_stores_nothing` | SR-11 | Preview voice chat logs nothing and raises no alerts | PASS |\n| `test_cors_allows_the_nextjs_app_only` | Security | Only the configured Next.js origin gets CORS headers | PASS |\n\n## Browser flows (`tests/e2e/test_frontend.py`, 12 tests)\n\n| Test | Hazard / requirement | What it proves | Result |\n|---|---|---|---|\n| `test_example_mode_works_without_a_server_and_is_marked_fictional` | Honesty | Example mode runs with no server and is labelled as a fictional family | PASS |\n| `test_caregiver_area_needs_the_pin` | H7 | The caregiver area stays locked until the right PIN is entered | PASS |\n| `test_patient_mode_never_shows_sensitive_or_locked_memories` | H6, SR-6 | Patient mode's “My memories” never shows SENSITIVE or LOCKED titles | PASS |\n| `test_demo_safety_scenario_uses_the_exact_safe_replies` | H5 | Demo Mode's Safety Alert shows the exact fixed replies and an urgent alert | PASS |\n| `test_try_as_kamala_stores_nothing_and_sends_no_alerts` | Oversight | Try as Kamala leaves the alert and activity counts unchanged | PASS |\n| `test_unknown_face_is_never_named` | H1, SR-1 | An unknown face in patient mode is never given a family name | PASS |\n| `test_photo_suggestion_saves_nothing_until_the_caregiver_chooses` | Oversight | Uploading a photo for suggestions, then Discard, saves nothing | PASS |\n| `test_erase_all_needs_confirmation` | Rights | Erase asks for confirmation; cancelling keeps all data | PASS |\n| `test_keyboard_palette_and_accessibility_preferences` | Accessibility | The Ctrl+K palette works by keyboard; extra-large text, high contrast and reduced motion apply; every visible field has a label | PASS |\n| `test_easy_view_is_one_click_and_reversible` | Accessibility | Easy view turns on and off with one click | PASS |\n| `test_presentation_bar_runs_the_locked_memory_scenario` | H6 | The presentation bar's locked-memory scenario refuses without the PIN | PASS |\n| `test_no_script_errors_on_any_page` | H12 | Every page renders without script errors or the error message | PASS |\n\n## Recognition scores on demo data\n\n| Person | Result | Score |\n|---|---|---|\n| Anjali (daughter) | recognised | 0.962 |\n| Rohan (grandson) | recognised | 0.970 |\n| Priya (granddaughter) | recognised | 0.954 |\n| Lakshmi (neighbour) | recognised | 0.959 |\n| Dr. Mehta (doctor) | recognised | 0.938 |\n| Ramesh (late husband, protected) | protected reply | 0.966 |\n| Unknown visitor | not sure, no name | 0.577 |\n\nRecognise threshold 0.88, uncertain threshold 0.75 (demo descriptor).\n", "docs/ARCHITECTURE.md": "# EchoBond Architecture\n\nVersion 2.0 · 3 October 2026\n\n## Pipeline to code\n\n| Stage (slide 3) | Code | Key idea |\n|---|---|---|\n| 01 Personal Data Input | Caregiver area → `POST /api/people`, `/api/memories`, `/api/reminders`, `/api/teach`, `/api/suggest` | Consent captured with the data; suggestions are never saved automatically |\n| 02 Memory Archive | `backend/database.py`, `backend/security.py`, `services/memory_store.py` | SQLite + encrypted media + vector index; four privacy levels enforced in the data layer |\n| 03 Multimodal Processing | `services/face_service.py`, `voice_service.py`, `caption_service.py`, `text_embedder.py` | Everything becomes a vector |\n| 04 Personalized Memory Model | `services/recognizer.py` | Closed-set cosine matching, 3 bands + margin; caregiver may only raise the threshold |\n| 05 Generative AI Engine | `services/genai_engine.py`, `services/conversation.py` | Intent rules → RAG → LLM → grounding check → soften; follow-up context |\n| 06 Context-Aware Recognition | `services/context_engine.py`, `services/safety.py` | Orientation, reminders, support categories, protected people, repeated questions |\n| 07 Patient Interaction | `frontend/js/patient/`, `frontend/js/features/lens.js` | Who is this? · Talk to EchoBond · My memories · Today's reminders |\n\n## Backend layout\n\n```\nbackend/\n  app.py            create_app(): blueprints, friendly JSON errors, static files\n  config.py         thresholds, providers, PIN, patient name (all from .env)\n  database.py       schema + in-place migration from v1 (_NEW_COLUMNS)\n  security.py       Fernet encryption, uploads, PIN check (X-Caregiver-Pin)\n  seed_demo.py      fictional example family and portraits\n  api/\n    people.py       people, photos, voice, relations, family graph\n    memories.py     memories (privacy, people, place, song, photo), unlock, places\n    lens.py         recognize, chat, teach, suggest, transcribe, speak, caption\n    routine.py      context, reminders (+ done), daily notes\n    oversight.py    alerts, interactions, summary, repeated, assistant, stats,\n                    settings, privacy, audit, export, erase-all\n  services/\n    face_service, voice_service, caption_service, text_embedder   (stage 03)\n    recognizer      bands + margin (stage 04)\n    memory_store    hybrid retrieval with privacy filters (stage 02/05)\n    genai_engine    answer() and describe_person() (stage 05)\n    conversation    normalize(), follow-up context, repeat counting\n    safety          support categories, fixed replies, alerts, grounding check, quiet() for TEST MODE\n    assistant       caregiver assistant and daily summary, built only from SQL queries\n    settings        caregiver settings with bounds (threshold can only go up)\n```\n\n## Request flow: \"Who is this?\"\n\n```\nphoto or camera frame\n  → POST /api/recognize (image kept in memory only, never stored)\n  → face_service.analyze()            # stage 03: detect + embed\n  → recognizer.identify_face()        # stage 04: cosine vs family, band + margin\n      ├─ unknown → \"I'm not sure who this is…\" (caregiver may Teach EchoBond)\n      ├─ uncertain → no name; caregiver sees the closest match\n      ├─ protected person → comfort script + caregiver alert\n      └─ recognized → genai_engine.describe_person()\n           → memory_store.search(person, audience=\"patient\")\n           → LLM with grounded prompt → safety.grounding_check() → soften\n  → JSON {status, text, person, confidence, confidence_label, why[], related[], memory_ids}\n```\n\n## Request flow: Talk to EchoBond\n\n```\nquestion\n  → safety.support_category()        urgent / fear / confusion / frustration / sadness / distress\n        → fixed calm reply + caregiver alert   (never reaches retrieval or the LLM)\n  → protected-person check           → comfort reply + alert\n  → \"Who else was there?\"            → people in the memory just discussed (conversation context)\n  → \"Who is Rohan?\"                  → the person record\n  → \"Where is Priya?\"                → only a visit saved in today's reminders, else \"I don't know\"\n  → retrieval (follow-ups reuse the last 4 turns / 15 minutes)\n        → generate → grounding check → soften → reply + why[]\n  → repeat counting: same normalised question ≥ threshold in the window → one caregiver note per day\n```\n\n## Family vault and voice companion\n\n```\nPOST /api/vault/person (multipart, PIN)\n  → profile + consents → each photo: face box + 512-D embedding (ArcFace, or the basic descriptor) → vector index\n  → voice clip: format, length (15–60 s), pitch → reference for XTTS-v2 / ElevenLabs (only with the owner's consent)\n  → memories, schedule, approved words (owner approval + named approver) → ingestion report\n\nPOST /api/voice-chat {message, person_id?}\n  → distress / protected person / no clear target → the normal Talk pipeline\n  → schedule now + voice consent + approved \"away\" words\n        → [EchoBond] disclosure → [person] approved words filled from the schedule (cloned audio or device voice)\n  → schedule but no approved words → EchoBond, third person\n  → \"Can I talk to …?\" → caregiver alert, never pretends\n  → returns segments [{speaker, text, badge, voice, audio_url}]\nGET /api/voice-chat/audio/<token> → WAV, or 204 when no cloning engine is installed\n```\n\nCode: `backend/api/vault.py`, `backend/services/companion.py`, `backend/services/voice_service.py`.\n\nPreview requests (Try as Kamala, `preview: true` with the PIN) run inside `safety.quiet()`: nothing is logged and no alert is raised. The response says what *would* have happened.\n\n## Why the safety layer is code\n\nPrompts are suggestions to a model, but code always runs. Every rule that protects the patient (thresholds, privacy levels, grounding, support categories, protected people, dose blocking) runs in Python outside the LLM. Swapping Gemini for Llama, or having no LLM at all, can't weaken safety.\n\n## Frontend\n\nNo build step. `frontend/index.html` loads plain scripts that share one global, `window.EB`.\n\n```\nfrontend/\n  index.html            page shell; script order matters (core → demo → api → router → features → views → main)\n  css/                  base (tokens, themes incl. high contrast), components, landing, app\n  js/core/              dom helpers, prefs (theme, size, motion, detail), speech, embed, api\n  js/demo/              rules.js + server.js: an in-browser copy of every API route (example mode)\n  js/ui/router.js       hash routes: #/ · #/patient/<view> · #/care/<view>/<arg>\n  js/features/          lens, teach, memory view, timeline, graph, map, music, palette, docs,\n                        sandbox (isolated TEST MODE client), demo-runner (7 scenarios)\n  js/landing/           landing page sections and the WebGL Memory Core\n  js/patient/           patient mode\n  js/care/              caregiver shell and views (home, alerts, assistant, notes, people,\n                        memories, reminders, try, activity, privacy, settings, help)\n```\n\n`EB.api` checks `/api/health` at start. If the Flask server answers, it runs in **live mode** against the real archive. Otherwise it runs **example mode**: `EB.demo.create()` builds an in-browser server with the same routes, response shapes and safety rules over the fictional family in `assets/family/demo.json`. Demo Mode and the landing-page lens use separate sandbox instances, so they never touch any other data.\n\n`scripts/build_site.py` is optional. It inlines everything into `dist/app/index.html` for hosting the example without a server.\n\n## Next.js frontend (`web/`)\n\nA Next.js 14 + Tailwind + Three.js app with routes `/`, `/patient` (home), `/patient/lens` (live camera recognition HUD), `/patient/talk` (familiar voice companion), `/patient/memories`, `/patient/routine`, `/care` and `/care/people` (family profile and memory vault). With `NEXT_PUBLIC_ECHOBOND_API` set it talks to the Flask server; otherwise it uses the in-browser engine. It imports the same in-browser engine (generated into `web/lib/engine.js` from `frontend/js` by `scripts/export_next_engine.py`), so its responses and safety rules match example mode exactly. On top, `web/lib/grounding.js` checks every patient-facing reply against the family's records before it is shown or spoken. Patient mode always calls the archive as the patient. See `web/README.md`.\n\n## Tests\n\n```\ntests/run_all.py            67 backend tests (test_echobond, test_v2_archive, test_v2_conversation, test_v2_lens, test_v3_vault_voice)\ntests/e2e/test_frontend.py  12 browser tests (Playwright) in live and example mode\n```\n\nSee [Test evidence](safety/TEST_EVIDENCE.md).\n", "docs/VIVA_QA.md": "# Viva Preparation: Likely Questions and Answers\n\n**Q1. Where exactly is the Generative AI?**\nFour places: (1) **RAG + LLM** writes the personalised description and chat replies from family memories; (2) **voice cloning (XTTS-v2)**, a generative speech model; (3) **BLIP**, a generative vision-language model that captions uploaded photos; (4) **Whisper**, a sequence-to-sequence transformer, for speech input.\n\n**Q2. Did you train a model?**\nNo foundation model is trained, and that's deliberate. Training on one family's 10 photos would overfit. Stage 04 is a *personalised* closed-set matcher over pre-trained embeddings (ArcFace). Adding a person is instant and needs no retraining. This is the same approach as few-shot face verification.\n\n**Q3. How do you stop hallucinations?**\nThree layers: (1) retrieval, so the model only gets the family's memories; (2) prompt rules; (3) a **post-generation grounding check in code** that rejects any reply with a capitalised name not in the archive, a year not in the retrieved memories, or medical or financial words. A rejected reply falls back to a template built only from saved text. Test `test_H2_llm_hallucination_falls_back_to_template` proves it.\n\n**Q4. What if it recognises the wrong person?**\nThat is the worst failure, so the design favours saying \"not sure\". There are three bands (recognise / not sure / unknown) and a **margin rule**: the best match must beat the second by 0.03. The patient is never given a guess. Only the caregiver sees \"closest match\".\n\n**Q5. Why cosine similarity and why the top-2 mean?**\nArcFace embeddings are trained on a hypersphere, so the angle (cosine) is the natural distance. Averaging a person's best 2 enrolment scores is more stable than one maximum, which a single lucky photo could inflate.\n\n**Q6. What is hybrid retrieval?**\nScore = 0.55 × embedding cosine + 0.30 × keyword overlap + 0.35 × title overlap, + 0.5 if the memory is about a person named in the question. Semantic search alone can miss names and nicknames. Keywords alone miss paraphrases.\n\n**Q7. How is privacy handled?**\nLocal-only storage, Fernet encryption of media, random filenames, a PIN on all changes, an audit log, export and erase, and recognition frames that are never stored. It is designed with reference to India's DPDP Act 2023, including guardian consent for a person who can't consent, but it has not been legally reviewed. See the DPIA. Each memory also has a privacy level (Normal, Private, Sensitive, Locked) that is enforced in the data layer.\n\n**Q8. Isn't a cloned voice deceptive?**\nEach cloned message starts with a disclosure (\"EchoBond, in Anjali's recorded voice\"). It needs the voice owner's own consent, never runs for the deceased, and never says anything outside saved memories. See the AI Voice Policy.\n\n**Q9. What happens if the patient asks about a spouse who has died?**\nThe person's status is set to *protected*. EchoBond neither announces the death nor pretends they're alive. It says they're very dear and that Anjali would love to talk about them, then alerts Anjali. That follows dementia-care practice of not forcing repeated grief.\n\n**Q10. How does it work without internet or a GPU?**\nEvery component has a fallback: template generator instead of an LLM, browser speech instead of XTTS, a basic image descriptor instead of InsightFace. `/api/health` shows which is active. With no server at all, the web app runs an in-browser copy of the API on a fictional example family, with the same rules, so it can be shown anywhere.\n\n**Q11. How did you evaluate it?**\nThere are 52 automated backend tests and 10 browser tests, mapped to 12 hazards (see Test Evidence). On demo data, recognition scored 5/5 with a clear gap (true matches 0.93 or higher, wrong matches 0.76 or lower). The model card lists the metrics needed for real faces, reported separately by skin tone, age and lighting.\n\n**Q12. Limitations?**\nThe demo descriptor is not biometric grade. Distress detection is keyword-based. There has been no clinical evaluation. Real use needs ethics committee approval and InsightFace.\n\n**Q13. Future work?**\nOn-device models for phones; a photo-frame mode; multilingual replies (Hindi, Tamil, Telugu) via an LLM plus XTTS multilingual; caregiver mobile notifications; a voice-activity \"who is speaking\" mode for phone calls.\n\n**Q14. Which SDG and why?**\nSDG 3, Good Health and Well-being, target 3.4 (mental health and well-being), because it reduces confusion and isolation for people with dementia and supports carers.\n\n**Q15. How does EchoBond handle repeated questions?**\nIt normalises each question (\"Where's Priya?\" and \"where is priya\" count as the same) and counts repeats in a window the caregiver sets (default 3 times in 24 hours). EchoBond answers kindly every time, and raises one gentle caregiver note per question per day with options: create a reminder, add a memory, review the conversation, or dismiss. It never suggests a diagnosis.\n\n**Q16. Can EchoBond learn new people or memories by itself?**\nNo. \"Teach EchoBond\" needs the caregiver PIN, the person's photo consent and a named consent giver. Photo suggestions are drafts only: nothing is saved until the caregiver chooses Save, Edit or Discard.\n\n**Q17. What does \"Where is Priya?\" do?**\nEchoBond doesn't track anyone's location. It only repeats a visit saved in today's reminders (\"Priya is visiting at 5 PM today.\"). Otherwise it says it doesn't know and suggests asking the caregiver.\n\n**Q18. What is \"Why did EchoBond say that?\"**\nEvery reply carries a list of the exact records used (the face match score and threshold, the person record, each memory), so a caregiver can check that nothing was invented.\n"};
</script>

    sensitive: ["protect", "Sensitive", "Never shared with Kamala"],

      const text = $("#vcTestText", d.el).value.trim();

        const bot = `<div class="msg-b bot"><b style="font-weight:500">${esc(r.answer)}</b>${r.items.length ? `<ul style="margin:6px 0 0;padding-left:18px">${r.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}${r.suggestion ? `<p class="small" style="margin-top:6px">${esc(r.suggestion)}</p>` : ""}<span class="meta">Based on: ${esc(r.based_on)}</span></div>`;
        log.insertAdjacentHTML("beforeend", bot); asked.push(bot);
      } catch (e) { log.insertAdjacentHTML("beforeend", `<div class="msg-b bot">${esc(e.message)}</div>`); }
      log.scrollTop = 1e9;
    }
    $("#asForm", el).addEventListener("submit", (e) => { e.preventDefault(); ask($("#asQ", el).value); });
    el.addEventListener("click", (e) => { const b = e.target.closest("[data-q]"); if (b) ask(b.dataset.q); });
  } });
})(window.EB);

;
/* Privacy & data, Settings, Help & documents. */
(function (EB) {
  "use strict";
  const { $, esc, confirmBox, attempt, fmtWhen } = EB.dom;

  EB.care.register("privacy", { async render(el) {
    const [p, audit] = await Promise.all([EB.api.get("/api/privacy"), EB.api.get("/api/audit")]);
    el.innerHTML = `<div class="view-head"><div><h1>Privacy & data</h1><p>What EchoBond stores about the family, who agreed to what, and full control to export or delete it. ${EB.api.live ? "Everything stays on this computer." : "In example mode, everything lives only in this browser tab."}</p></div></div>
      <div class="kpis">${[["People", p.people], ["Face photos stored", p.photos], ["Voice samples", p.voice_samples], ["Memories", p.memories]].map(([l, v]) => `<div class="card kpi" style="cursor:default"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join("")}</div>
      <div class="grid2"><div class="card"><div class="card-h"><h2>What's stored, and what isn't</h2></div><ul class="rows">
          <li><span class="t">✓</span><div class="main"><b>Photos and voice samples</b><div class="sub">${p.encryption_at_rest ? "Encrypted on disk, filed under random names." : "Example mode: kept in browser memory only."}</div></div><span></span></li>
          <li><span class="t">✓</span><div class="main"><b>Face embeddings: ${p.face_embeddings}</b><div class="sub">Numbers made from photos, used to compare faces. Deleted when face consent is withdrawn.</div></div><span></span></li>
          <li><span class="t">✓</span><div class="main"><b>Activity records: ${p.interactions}</b><div class="sub">The result of each face check and conversation.</div></div><span></span></li>
          <li><span class="t">✗</span><div class="main"><b>Camera pictures: ${p.camera_frames_stored}</b><div class="sub">Photos used to check a face are never saved.</div></div><span></span></li>
          <li><span class="t">✗</span><div class="main"><b>Location, contacts, money</b><div class="sub">EchoBond never collects these.</div></div><span></span></li></ul></div>
        <div class="card"><div class="card-h"><h2>Consent records</h2><a class="btn sm" href="#/care/people">Manage</a></div><div class="tw"><table><thead><tr><th>Person</th><th>Face</th><th>Voice copy</th><th>Given by</th></tr></thead><tbody>
          ${p.consent_records.map((r) => `<tr><td>${esc(r.name)}</td><td>${r.consent_photo ? `<span class="chip ok">Yes</span>` : `<span class="chip">No</span>`}</td><td>${r.consent_voice_clone ? `<span class="chip ok">Yes</span>` : `<span class="chip">No</span>`}</td><td class="muted small">${esc(r.consent_given_by || "–")}</td></tr>`).join("")}</tbody></table></div></div></div>
      <div class="grid2"><div class="card"><div class="card-h"><h2>Your data</h2></div><div class="card-b stack">

          <div class="spread"><div><b style="font-weight:500">Erase everything</b><p class="small muted">Deletes all people, photos, voices, memories and notes. Files are overwritten before they're removed. This can't be undone.</p></div><button class="btn danger" type="button" id="eraseBtn">Erase all data</button></div>
          <pre id="expOut" hidden style="max-height:240px;overflow:auto;font:12px/1.5 var(--mono);background:var(--surface-2);padding:10px;border-radius:4px;margin:0"></pre></div></div>
        <div class="card"><div class="card-h"><h2>Audit log</h2><span>Every change, newest first</span></div><div class="tw" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead><tbody>
          ${audit.slice(0, 120).map((a) => `<tr><td class="num" style="white-space:nowrap">${esc(fmtWhen(a.created_at))}</td><td>${esc(a.actor)}</td><td class="mono small">${esc(a.action)} <span class="faint">${esc(a.target)}</span></td></tr>`).join("")}</tbody></table></div></div></div>`;
    $("#expBtn", el).addEventListener("click", async () => {

      if (EB.api.live) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = "echobond-export.json"; a.click(); EB.dom.toast("Export downloaded"); }
      else { $("#expOut", el).hidden = false; $("#expOut", el).textContent = text; EB.dom.toast("Example export shown below"); }

    $("#eraseBtn", el).addEventListener("click", async () => {
      if (!(await confirmBox("Erase all of the family's data? This permanently deletes every person, photo, voice sample, memory and note.", "Erase everything"))) return;
